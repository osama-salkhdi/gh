    <div>القسمة: ${M(P(b+'^('+m+') ÷ '+b+'^('+n+') = '+r(p(b,m)/p(b,n))+' = '+b+'^('+(m-n)+') = '+r(p(b,m-n))))}</div>
    <div>قوة القوة: ${M(P('('+b+'^('+m+'))^('+n+') = '+r(p(p(b,m),n))+' = '+b+'^('+(m*n)+') = '+r(p(b,m*n))))}</div>
    <div>أس سالب: ${M(P(b+'^('+(-n)+') = 1/'+b+'^('+n+') = '+r(1/p(b,n))))}</div>
    <div>أس صفري: ${M(b+'^(0) = 1'.replace('^(0)','<sup>0</sup>'))} — أس كسري ${M('1/2')}: ${M(P(b+'^(1/2) = '+r(Math.sqrt(b))))}</div>`;});
};

TOOLS.sci=c=>{
  el(c,`<div><label>العدد:</label><input data-k="n" value="0.0000000000123" size="18" dir="ltr"> <label>أو بالعكس: a =</label><input data-k="a" value="1.23" size="6" dir="ltr"> <label>الأس n =</label><input data-k="e" value="8" size="4" dir="ltr"></div><div class="out" data-k="o"></div>`);

      h+=`<div>${M(K(c,'n').value+' = '+aa+' × 10^('+ex+')')}</div><div>صيغة E: ${M(aa+'E'+(ex<0?'−':'+')+String(Math.abs(ex)).padStart(2,'0'))}</div><div>الفاصلة تحرّكت ${M(Math.abs(ex))} خانة نحو ${ex>=0?'اليسار (الأس موجب)':'اليمين (الأس سالب)'}.</div>`;}
    const a=nv(K(c,'a').value),e=Math.round(nv(K(c,'e').value));

    K(c,'o').innerHTML=P(h).replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>');});
};

/* ---------- جدول لوغاريتمي محاكى ---------- */
const T10=a=>Math.round(Math.log10(a)*10000)/10000;       // قيمة الجدول لعدد بثلاث خانات
const TLN=a=>Math.round(Math.log(a)*10000)/10000;
function sciParts(N){const ex=Math.floor(Math.log10(N)+1e-12);let a=N/Math.pow(10,ex);if(a>=10){a/=10;}return {a:+a.toPrecision(10),ex};}
function lookup(a,T){const a1=Math.floor(a*100+1e-9)/100,a2=a1+0.01;const t1=T(a1),t2=T(Math.min(a2,9.99)>a1?a2:a1);const fr=(a-a1)/0.01;return {a1,a2,t1,t2,v:t1+fr*(t2-t1),fr};}
const bar=(ch,man)=>ch<0?M('<span style="text-decoration:overline">'+(-ch)+'</span>.'+f(man,4).slice(2)):M(ch+'.'+f(man,4).slice(2));

      let best=1,bd=9;for(let a=1;a<10;a+=0.01){const v=Math.abs(T10(Math.round(a*100)/100)-man);if(v<bd){bd=v;best=Math.round(a*100)/100;}}

      K(c,'o2').innerHTML=`<ol><li>نفصل: الجزء الصحيح ${M(ch)} (أس العدد 10) والجزء العشري ${M(f(man,4))}</li><li>نبحث عن ${M(f(man,4))} داخل الجدول فنجد العدد ≈ ${M(f(aa,3))}</li><li>الجواب: ${M(f(aa,3)+' × 10^('+ch+')')} = ${M(g(Math.pow(10,l),5))}</li></ol><div>بالآلة: ${M(g(Math.pow(10,l),6))}</div>`.replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>');}

};

function niceTicks(lo,hi,n=5){const span=hi-lo||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw)));const st=[1,2,5,10].map(x=>x*p).find(x=>x>=raw)||p*10;const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toPrecision(10));return out;}
function drawPlot(pts,mode,fit){
  const W=420,H=300,L=52,R=12,T=12,B=34;
  const xl=mode==='loglog',yl=mode!=='linear';
  const tx=v=>xl?Math.log10(v):v,ty=v=>yl?Math.log10(v):v;
  const xs=pts.map(p=>tx(p[0])),ys=pts.map(p=>ty(p[1]));
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(xl){x0=Math.floor(x0);x1=Math.ceil(x1);}else{const s=(x1-x0)*0.08||1;x0-=s;x1+=s;if(x0>0&&x0<(x1-x0)*0.2)x0=0;}
  if(yl){y0=Math.floor(y0);y1=Math.ceil(y1);if(y0===y1)y1++;}else{const s=(y1-y0)*0.1||1;y0=Math.min(0,y0);y1+=s;}
  if(x0===x1)x1++;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(v-y0)/(y1-y0)*(H-B-T);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="background:#fff;border:1px solid #cfd8e6;border-radius:8px;max-width:100%;direction:ltr" font-family="Cairo,sans-serif" font-size="11">`;
  const ticks=(lo,hi,log)=>log?Array.from({length:Math.round(hi-lo)+1},(_,i)=>lo+i):niceTicks(lo,hi);
  ticks(x0,x1,xl).forEach(v=>{const px=X(v);s+=`<line x1="${px}" x2="${px}" y1="${T}" y2="${H-B}" stroke="#e3e9f2"/><text x="${px}" y="${H-B+14}" text-anchor="middle" fill="#445">${xl?'10^'+v:(+v.toPrecision(6))}</text>`;});
  ticks(y0,y1,yl).forEach(v=>{const py=Y(v);s+=`<line y1="${py}" y2="${py}" x1="${L}" x2="${W-R}" stroke="#e3e9f2"/><text x="${L-5}" y="${py+4}" text-anchor="end" fill="#445">${yl?'10^'+v:(+v.toPrecision(6))}</text>`;});
  if(yl)for(let d=Math.floor(y0);d<y1;d++)for(let m=2;m<10;m++){const py=Y(d+Math.log10(m));s+=`<line y1="${py}" y2="${py}" x1="${L}" x2="${W-R}" stroke="#f0f3f8"/>`;}
  if(xl)for(let d=Math.floor(x0);d<x1;d++)for(let m=2;m<10;m++){const px=X(d+Math.log10(m));s+=`<line x1="${px}" x2="${px}" y1="${T}" y2="${H-B}" stroke="#f0f3f8"/>`;}
  s+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-B-T}" fill="none" stroke="#889"/>`;
  if(fit){const a=x0,b=x1;s+=`<line x1="${X(a)}" y1="${Y(fit.s*a+fit.i)}" x2="${X(b)}" y2="${Y(fit.s*b+fit.i)}" stroke="#d98a00" stroke-width="2" stroke-dasharray="6 3"/>`;}
  pts.forEach((p,i)=>{s+=`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="4.5" fill="#1f4e79"/>`;});
  if(fit&&fit.mark){const m=fit.mark;s+=`<line x1="${X(m.tx)}" x2="${X(m.tx)}" y1="${H-B}" y2="${Y(m.ty)}" stroke="#c0392b" stroke-dasharray="3 3"/><line x1="${L}" x2="${X(m.tx)}" y1="${Y(m.ty)}" y2="${Y(m.ty)}" stroke="#c0392b" stroke-dasharray="3 3"/><circle cx="${X(m.tx)}" cy="${Y(m.ty)}" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>`;}
  s+=`<text x="${(L+W-R)/2}" y="${H-3}" text-anchor="middle" fill="#334" font-weight="700">x</text><text x="12" y="${(T+H-B)/2}" fill="#334" font-weight="700">y</text></svg>`;
  return s;
}
const PRE={lin:{t:'1 2\n2 4\n3 6\n4 8\n5 10\n6 12',m:'linear',x:'1.7'},exp:{t:'1 1.8\n2 3.3\n4 10.4\n6 33\n8 102\n10 310',m:'semilog',x:'7'},pow:{t:'1 1\n2 4\n3 9\n4 16\n5 25\n10 100',m:'loglog',x:'7'},rea:{t:'1 90000\n3 40000\n10 20000\n30 12000\n100 8000\n300 4000\n1000 1500',m:'loglog',x:'120'}};
TOOLS.plot=c=>{
  el(c,`<div>أمثلة جاهزة: <button class="btn alt" data-p="lin">خطي</button><button class="btn alt" data-p="exp">أسّي (الجدول 3)</button><button class="btn alt" data-p="pow">قوة y=x²</button><button class="btn alt" data-p="rea">نشاط الوقود</button></div>

  <div><label>نوع الورق:</label><select data-k="m"><option value="linear">خطي / خطي</option><option value="semilog" selected>لوغاريتمي / خطي (y لوغاريتمي)</option><option value="loglog">لوغاريتمي / لوغاريتمي</option></select> <label>اقرأ y عند x =</label><input data-k="x" value="7" size="6" dir="ltr"></div>
  <div data-k="g"></div><div class="out" data-k="o"></div>`);

    const pts=K(c,'t').value.split(/\n/).map(l=>l.trim().split(/[\s,؛;]+/).map(nv)).filter(a=>a.length>=2&&Number.isFinite(a[0])&&Number.isFinite(a[1]));
    const mode=K(c,'m').value;const xl=mode==='loglog',yl=mode!=='linear';

    const X=ok.map(p=>xl?Math.log10(p[0]):p[0]),Y=ok.map(p=>yl?Math.log10(p[1]):p[1]);const n=ok.length;
    const mx=X.reduce((a,b)=>a+b)/n,my=Y.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0,syy=0;X.forEach((x,i)=>{sxy+=(x-mx)*(Y[i]-my);sxx+=(x-mx)**2;syy+=(Y[i]-my)**2;});
    const s=sxy/sxx,i0=my-s*mx,r2=syy?sxy*sxy/(sxx*syy):1;
    const xr=nv(K(c,'x').value);let mark=null,txt='';
    if(Number.isFinite(xr)&&(!xl||xr>0)){const tx=xl?Math.log10(xr):xr,ty=s*tx+i0;const yv=yl?Math.pow(10,ty):ty;mark={tx,ty};
      const inside=xr>=Math.min(...ok.map(p=>p[0]))&&xr<=Math.max(...ok.map(p=>p[0]));
      txt=`<div>عند ${M('x = '+g(xr,5))} نقرأ ${M('y ≈ '+g(yv,4))} — ${inside?'استيفاء داخلي (داخل مدى البيانات)':'استيفاء خارجي (خارج مدى البيانات)'}.</div>`;}
    K(c,'g').innerHTML=drawPlot(ok,mode,{s,i:i0,mark});
    let law='';

    else law=`${M('y = '+g(Math.pow(10,i0),4)+' × x^('+g(s,4)+')')} (علاقة قوّة، الميل = الأس)`;
    K(c,'o').innerHTML=`<div>أفضل خط مستقيم في الورق المختار: ${law.replace(/\^\(([^)]*)\)/g,'<sup>$1</sup>')}</div><div>مدى الاستقامة ${M('R² = '+f(r2,4))} ${r2>0.99?'(النقاط مستقيمة تقريبًا ✓)':'(النقاط ليست مستقيمة على هذا الورق؛ جرّب ورقًا آخر)'}</div>${txt}`;
  };
  wire(c,upd);
};

/* ---------- 12) محاكاة العدّ ---------- */
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pois(mu){if(mu>30)return Math.max(0,Math.round(mu+Math.sqrt(mu)*randn()));let L=Math.exp(-mu),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
TOOLS.sim=c=>{
  el(c,`<div><label>التجربة:</label><select data-k="t"><option value="cnt">عدّ عينة مشعّة (متوسط μ)</option><option value="coin">رمي عملة 100 مرة × مجموعات</option></select> <label>μ:</label><input data-k="mu" value="92" size="5" dir="ltr"> <label>عدد القياسات:</label><input data-k="n" value="240" size="5" dir="ltr"> <button class="btn" data-k="go">أعد التجربة 🎲</button></div><div data-k="g"></div><div class="out" data-k="o"></div>`);
  const run=()=>{const t=K(c,'t').value,mu=Math.max(1,nv(K(c,'mu').value)||92),N=Math.max(2,Math.min(5000,Math.round(nv(K(c,'n').value)||240)));
    const data=[];for(let i=0;i<N;i++){if(t==='coin'){let h=0;for(let j=0;j<100;j++)h+=Math.random()<0.5?1:0;data.push(h);}else data.push(pois(mu));}
    const mean=data.reduce((a,b)=>a+b)/N,sd=Math.sqrt(data.reduce((a,b)=>a+(b-mean)**2,0)/(N-1));
    const th=t==='coin'?5:Math.sqrt(mu),mc=t==='coin'?50:mu;
    const w1=data.filter(v=>Math.abs(v-mean)<=sd).length/N*100,w2=data.filter(v=>Math.abs(v-mean)<=2*sd).length/N*100;
    const lo=Math.min(...data),hi=Math.max(...data),bins=Math.min(24,hi-lo+1),bw=(hi-lo+1)/bins,cnt=Array(bins).fill(0);data.forEach(v=>cnt[Math.min(bins-1,Math.floor((v-lo)/bw))]++);
    const mxc=Math.max(...cnt),W=420,H=170,bW=(W-20)/bins;
    let s=`<svg viewBox="0 0 ${W} ${H+22}" style="background:#fff;border:1px solid #cfd8e6;border-radius:8px;max-width:100%;direction:ltr" font-size="10">`;
    cnt.forEach((v,i)=>{const h=v/mxc*(H-14);const mid=lo+(i+0.5)*bw;const inside=Math.abs(mid-mean)<=sd;s+=`<rect x="${10+i*bW+1}" y="${H-h}" width="${bW-2}" height="${h}" fill="${inside?'#1f4e79':(Math.abs(mid-mean)<=2*sd?'#6fa3d0':'#c9d9ea')}"/>`;});
    s+=`<line x1="10" x2="${W-10}" y1="${H}" y2="${H}" stroke="#667"/><text x="10" y="${H+14}">${lo}</text><text x="${W-10}" y="${H+14}" text-anchor="end">${hi}</text><text x="${W/2}" y="${H+14}" text-anchor="middle">${f(mean,1)} (المتوسط)</text></svg>`;
    K(c,'g').innerHTML=s;
    K(c,'o').innerHTML=`<div>المتوسط ${M(f(mean,2))} (المتوقع ${M(mc)}) — الانحراف المعياري المقيس ${M(f(sd,2))} (النظري ${M(f(th,2))}${t==='coin'?' = √(100×½×½)':' = √μ'})</div><div>القياسات ضمن ${M('±1σ')}: ${M(f(w1,1)+'%')} (المتوقع ≈68%) — ضمن ${M('±2σ')}: ${M(f(w2,1)+'%')} (المتوقع ≈95%)</div><div style="color:var(--muted)">الأعمدة الداكنة ضمن 1σ، والمتوسطة ضمن 2σ، والباهتة خارجهما.</div>`;};
  c.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.k==='go')run();});c.addEventListener('change',e=>{if(e.target.dataset.k==='t'){K(c,'mu').disabled=K(c,'t').value==='coin';run();}});run();
};

/* ---------- 13) حاسبة الانحراف المعياري للعدّ ---------- */
TOOLS.stats=c=>{
  el(c,`<div><label>الحالة:</label><select data-k="md"><option value="1">قياس واحد: σ = √n</option><option value="2">قياس واحد مع الخلفية</option><option value="3">معدّل العدّ: σ = √(R/t)</option><option value="4">معدّل العدّ مع الخلفية</option></select> <label>مستوى الثقة:</label><select data-k="lv"><option value="0.7">50% (0.7σ)</option><option value="1" selected>68% (1σ)</option><option value="1.6">90% (1.6σ)</option><option value="2">95% (2σ)</option></select></div>
  <div><label>العدّات n:</label><input data-k="n" value="566" size="8" dir="ltr"> <span data-k="fb"><label>عدّات الخلفية:</label><input data-k="nb" value="20" size="8" dir="ltr"></span> <span data-k="ft"><label>الزمن (دقيقة):</label><input data-k="t" value="5" size="6" dir="ltr"></span> <span data-k="fr"><label>معدّل الخلفية (cpm):</label><input data-k="rb" value="32" size="6" dir="ltr"> <label>زمنها (دقيقة):</label><input data-k="tb" value="30" size="6" dir="ltr"></span></div><div class="out" data-k="o"></div>`);
  wire(c,()=>{const md=K(c,'md').value,lv=+K(c,'lv').value;const n=nv(K(c,'n').value),nb=nv(K(c,'nb').value),t=nv(K(c,'t').value),rb=nv(K(c,'rb').value),tb=nv(K(c,'tb').value);
    K(c,'fb').style.display=md==='2'?'':'none';K(c,'ft').style.display=(md==='3'||md==='4')?'':'none';K(c,'fr').style.display=md==='4'?'':'none';
    let h='',val,sg,unit='';
    if(md==='1'){if(!(n>=0)){h='اكتب n ≥ 0';}else{sg=Math.sqrt(n);val=n;h=`${M('σ = √'+n+' = '+f(sg,2))}`;}}
    else if(md==='2'){if(!(n>=0&&nb>=0)){h='اكتب قيمًا غير سالبة';}else{sg=Math.sqrt(n+nb);val=n;h=`${M('σ = √('+n+' + '+nb+') = √'+(n+nb)+' = '+f(sg,2))}`;}}
    else if(md==='3'){if(!(n>0&&t>0)){h='اكتب n و t موجبين';}else{const R=n/t;sg=Math.sqrt(R/t);val=R;unit=' cpm';h=`${M('R = '+n+'/'+t+' = '+f(R,2)+' cpm')}<br>${M('σ = √(R/t) = √('+f(R,2)+'/'+t+') = '+f(sg,2))}`;}}
    else{if(!(n>0&&t>0&&rb>=0&&tb>0)){h='اكتب قيمًا صحيحة';}else{const R=n/t,s1=Math.sqrt(R/t),s2=Math.sqrt(rb/tb);sg=Math.hypot(s1,s2);val=R;unit=' cpm';h=`${M('R = '+f(R,2)+' cpm ، σ<sub>R</sub> = '+f(s1,3))}<br>${M('σ<sub>b</sub> = √('+rb+'/'+tb+') = '+f(s2,3))}<br>${M('σ<sub>net</sub> = √(σ<sub>R</sub>² + σ<sub>b</sub>²) = '+f(sg,2))}`;}}
    if(sg!==undefined)h+=`<div style="margin-top:6px;font-weight:800">النتيجة عند هذا المستوى: ${M(g(val,5)+' ± '+g(sg*lv,3)+unit)}</div>`;
    K(c,'o').innerHTML=h;});
};

/* ---------- 14) حاسبة سلسلة القياسات ---------- */
TOOLS.series=c=>{
  el(c,`<div><label>القياسات (افصل بفاصلة أو مسافة):</label></div><textarea data-k="t" rows="2" dir="ltr">10 12 7 10 12 9 10 7 9 10</textarea><div class="out" data-k="o"></div>`);
  wire(c,()=>{const a=K(c,'t').value.split(/[\s,،;]+/).map(nv).filter(Number.isFinite),N=a.length;
    if(N<2){K(c,'o').innerHTML='أدخل قياسين على الأقل.';return;}
    const m=a.reduce((x,y)=>x+y)/N,ss=a.reduce((x,y)=>x+(y-m)**2,0),om=Math.sqrt(ss/(N-1)),E=om/Math.sqrt(N);
    K(c,'o').innerHTML=`<table style="border-collapse:collapse;direction:ltr;margin:4px 0"><tr><th style="border:1px solid #cdd;padding:2px 8px">n</th><th style="border:1px solid #cdd;padding:2px 8px">n − n̄</th><th style="border:1px solid #cdd;padding:2px 8px">(n − n̄)²</th></tr>${a.map(v=>`<tr><td style="border:1px solid #cdd;padding:2px 8px">${v}</td><td style="border:1px solid #cdd;padding:2px 8px">${f(v-m,2)}</td><td style="border:1px solid #cdd;padding:2px 8px">${f((v-m)**2,2)}</td></tr>`).join('')}</table>
    <div>${M('N = '+N+' ، n̄ = '+f(m,3)+' ، Σ(n−n̄)² = '+f(ss,3))}</div><div>${M('Ω = √(Σ/(N−1)) = '+f(om,3))} — الخطأ المعياري ${M('E = Ω/√N = '+f(E,3))}</div><div style="font-weight:800">النتيجة: ${M(f(m,2)+' ± '+f(E,2))} عند 68% — ${M(f(m,2)+' ± '+f(2*E,2))} عند 95%</div>`;});
};

boot();
</script>
