<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرياضيات الداعمة لأولمبياد العلوم النووية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1a2540;--muted:#5b6785;--main:#1b4965;--main2:#0d2f45;--accent:#e09f3e;--ok:#2e9e5b;--bad:#d64545;--line:#dde4f0;--soft:#eaf2f8;--warn:#fff4dc}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;font-size:17px}
header{background:radial-gradient(circle at 12% 0,#2f7199 0,transparent 45%),linear-gradient(135deg,var(--main),var(--main2));color:#fff;text-align:center;padding:26px 14px 18px;border-bottom:5px solid var(--accent)}
header .office{font-size:clamp(20px,4vw,30px);font-weight:800}
header .title{margin-top:2px;font-size:clamp(17px,3.2vw,24px);font-weight:700;color:#ffd98a}
header .sub{font-size:clamp(13px,2.4vw,16px);opacity:.92}
header .author{margin-top:8px;display:inline-block;background:rgba(255,255,255,.14);padding:3px 18px;border-radius:30px;font-size:15px}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 10px;box-shadow:0 2px 6px rgba(20,40,80,.06)}
nav button{font-family:inherit;font-weight:700;font-size:15px;white-space:nowrap;border:2px solid var(--line);background:#f7fafd;color:var(--main);border-radius:30px;padding:4px 16px;cursor:pointer}
nav button.on{background:var(--main);color:#fff;border-color:var(--main)}
nav .chip{margin-inline-start:auto;white-space:nowrap;align-self:center;background:var(--soft);color:var(--main);border-radius:30px;padding:2px 14px;font-weight:700;font-size:14px}
main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
h2{color:var(--main);font-size:clamp(21px,3.4vw,27px);margin:6px 0 2px}
.lead{color:var(--muted);margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:12px 0;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.box.warn{background:var(--warn);border-color:#f0d9a3}
.box.com h3{margin:0 0 4px;color:var(--main);font-size:18px}
.box.com ul{margin:4px 0;padding-inline-start:20px}
.idea{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;box-shadow:0 2px 8px rgba(20,40,80,.05);overflow:hidden}
.idea>summary{cursor:pointer;list-style:none;padding:12px 18px;font-weight:800;font-size:19px;color:var(--main);display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#fff,var(--soft))}
.idea>summary::-webkit-details-marker{display:none}
.idea>summary .no{background:var(--accent);color:#fff;border-radius:10px;padding:0 10px;font-size:15px}
.idea>summary::after{content:'▾';margin-inline-start:auto;color:var(--muted)}
.idea[open]>summary::after{content:'▴'}
.ib{padding:6px 18px 16px}
.ib h4{margin:14px 0 4px;color:var(--main);font-size:17px;border-right:5px solid var(--accent);padding-right:8px}
.ib p{margin:4px 0}
.rules{background:#f2f8ee;border:1px solid #cfe5c4;border-radius:12px;padding:6px 14px;margin:8px 0}
.rules ul{margin:4px 0;padding-inline-start:20px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Cairo','Courier New',monospace;font-weight:700;color:#12354d}
.mb{display:block;direction:ltr;text-align:left;background:#f7fafd;border:1px solid var(--line);border-radius:8px;padding:2px 12px;margin:4px 0;font-family:'Courier New',monospace;font-weight:700;overflow-x:auto;white-space:pre}
code{direction:ltr;unicode-bidi:isolate;background:#eef3f8;border-radius:5px;padding:0 5px;font-family:'Courier New',monospace;font-weight:700}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fcfdff}
.ex .src{display:inline-block;background:var(--soft);color:var(--main);border-radius:20px;padding:0 12px;font-size:13px;font-weight:700;margin-bottom:2px}
.ex .src.mine{background:#efe8fb;color:#5a3e9b}
.ex .q{font-weight:700}
.btn{font-family:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:5px 16px;cursor:pointer;background:var(--main);color:#fff;margin:4px 0 4px 6px}
.btn.alt{background:#fff;color:var(--main);border:2px solid var(--main)}
.sol{display:none;background:#fff9ee;border-right:5px solid var(--accent);border-radius:10px;padding:6px 14px;margin-top:6px}
.sol.show{display:block;animation:in .3s}
.sol ol{margin:4px 0;padding-inline-start:22px}
.ans{font-weight:800;color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opt{font-family:inherit;font-size:17px;font-weight:700;border:2px solid var(--line);background:#f7fafd;border-radius:10px;padding:2px 16px;cursor:pointer;min-width:70px}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt.right{background:#e8f6ee;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#fdecec;border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.verdict.ok{color:var(--ok);font-weight:800}.verdict.no{color:var(--bad);font-weight:800}
details.tool{border:2px dashed var(--accent);border-radius:12px;margin:12px 0;background:#fffdf7}
details.tool>summary{cursor:pointer;font-weight:800;padding:6px 14px;color:#8a5a00}
.tl{padding:6px 14px 12px}
.tl label{font-weight:700;margin-inline-end:6px}
.tl input,.tl select,.tl textarea{font-family:'Courier New',monospace;font-size:16px;border:2px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;max-width:100%}
.tl textarea{width:100%;direction:ltr}
.tl .out{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-top:6px;min-height:30px;direction:rtl}
.tl .out .row{display:flex;gap:8px;flex-wrap:wrap}
.tl .kv{background:var(--soft);border-radius:8px;padding:0 10px;margin:2px}
.grid{display:grid;gap:2px;direction:ltr;margin:6px 0}
.cell{width:34px;height:34px;border:1px solid #c5d0e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.cell.on{background:var(--main);color:#fff}
.cell.ok{background:var(--ok)}
svg{max-width:100%;height:auto}
.cheat h3{color:var(--main);margin:14px 0 4px}
.cheat li{margin:3px 0}
.map a{color:var(--main);font-weight:700;cursor:pointer;text-decoration:underline}
.map li{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:14px;padding:18px 10px 28px;border-top:1px solid var(--line)}
@media(max-width:560px){body{font-size:16px}.ib{padding:4px 12px 14px}.cell{width:30px;height:30px}}
</style>
</head>
<body>
<header>
  <div class="office">مكتب الأولمبياد العلمي السوري بدرعا</div>
  <div class="title">الرياضيات الداعمة لأولمبياد العلوم النووية</div>
  <div class="sub">مساق التعليم الذاتي لطلاب الصف الأول الثانوي — مرحلة الاختبار الأول — دليل دراسة وتدريب</div>
  <div class="author">إعداد المهندس أسامة ياسر الصلخدي</div>
</header>
<nav></nav>
<main id="app"></main>
<footer>مكتب الأولمبياد العلمي السوري بدرعا — إعداد المهندس أسامة ياسر الصلخدي</footer>
<script>
const CFG={unit:'الفصل',sup:true,nomap:true,boxTitle:'🎯 ماذا ستتعلم في هذا الفصل ولماذا يهمّك؟'};
const AXES=[
/* ============ الفصل 1: التدوير ============ */
{id:'c1',no:1,title:'التدوير (Rounding)',sub:'كيف نكتب العدد بالدقّة المناسبة: الأرقام المعنوية والمنازل العشرية.',
committee:[
'في قياسات الإشعاع تحصل على أعداد طويلة من الحاسبة، لكن دقّة القياس محدودة؛ فالتدوير يمنعك من ادّعاء دقّة لا تملكها.',
'ستتعلم قاعدتين: التدوير إلى عدد من {{الأرقام المعنوية}}، والتدوير إلى عدد من {{المنازل العشرية}}، ومتى تختار هذه أو تلك.',
'الخطأ الأشهر: عدّ الأصفار في بداية العدد (مثل {{0.0034}}) كأرقام معنوية. سنتدرّب على تجنّبه.'],
ideas:[
{id:'i11',title:'الأرقام المعنوية والمنازل العشرية',
idea:[
'{{المنازل العشرية}} هي الأرقام التي تأتي بعد الفاصلة العشرية. فالعدد {{2.10}} له منزلتان عشريتان.',
'{{الأرقام المعنوية}} هي الأرقام التي تدلّ على دقّة العدد. نعدّ من أول رقم غير صفري من اليسار حتى آخر رقم في العدد.',
'القاعدة الأهم: الصفر ليس رقمًا معنويًا إلا في حالتين: (1) إذا كان بين رقمين آخرين مثل {{103}}، أو (2) إذا كان الرقم الأخير بعد الفاصلة مثل {{2.10}}. لذلك فالعدد {{2.10}} له 3 أرقام معنوية.',
'قاعدة التدوير: انظر إلى الرقم الذي سيُحذف. إذا كان {{5}} أو أكبر زِد الرقم السابق بمقدار 1 (تدوير بالزيادة)، وإذا كان أقل من {{5}} فاترك الرقم السابق كما هو (تدوير بالنقصان).'],
rules:[
'{{2.55 ، 2.56 ، 2.57 ، 2.58 ، 2.59}} تصبح كلها {{2.6}} عند التدوير إلى رقمين معنويين (أو منزلة عشرية واحدة).',
'{{2.50 ، 2.51 ، 2.52 ، 2.53 ، 2.54}} تصبح كلها {{2.5}} عند التدوير إلى رقمين معنويين.',
'عند التدوير للأعداد الكبيرة نملأ الباقي بأصفار: {{13 456}} إلى رقمين معنويين هو {{13 000}} (هذه الأصفار ليست معنوية).',
'الأصفار في بداية العدد العشري ليست معنوية أبدًا: {{0.003417}} له 4 أرقام معنوية فقط.'],
solved:[
{src:'من المادة التدريبية — الجدول 1',short:'تدوير 525.7910',q:'دوّر العدد {{525.7910}} إلى: (أ) 4 أرقام معنوية (ب) 3 أرقام معنوية (ج) رقمين معنويين، ثم إلى منزلتين عشريتين.',steps:['4 أرقام معنوية: نحتفظ بـ {{525.7}} والرقم التالي {{9}} ≥ 5 فنزيد {{7}} فيصبح {{525.8}}.','3 أرقام معنوية: نحتفظ بـ {{525}} والرقم التالي {{7}} ≥ 5 فيصبح {{526}}.','رقمان معنويان: نحتفظ بـ {{52}} والرقم الأول المحذوف {{5}} ≥ 5 فنزيد {{52}} إلى {{53}} ثم نملأ بصفر ({{530}}) للحفاظ على القيمة.','منزلتان عشريتان: نحتفظ بـ {{525.79}} والرقم التالي {{1}} < 5 فيبقى {{525.79}}.'],ans:'{{525.8 ، 526 ، 530}} وبمنزلتين عشريتين {{525.79}}',id:'s-11-1'},
{src:'من المادة التدريبية — الجدول 1',short:'تدوير 0.003417',q:'دوّر العدد {{0.003417}} إلى: 3 أرقام معنوية، ثم رقمين معنويين، ثم رقم معنوي واحد.',steps:['الأرقام المعنوية تبدأ من أول رقم غير صفري: {{3 ، 4 ، 1 ، 7}} (الأصفار الأولى غير معنوية).','3 أرقام: نحذف {{7}} فنزيد {{1}} فيصبح {{0.00342}}.','رقمان: نحذف {{17}} والرقم الأول المحذوف {{1}} < 5 فيصبح {{0.0034}}.','رقم واحد: الرقم المحذوف {{4}} < 5 فيبقى {{0.003}}.'],ans:'{{0.00342 ، 0.0034 ، 0.003}}',id:'s-11-2'},
{src:'★ مثال من إعداد المكتب',short:'عدد الأرقام المعنوية',q:'كم رقمًا معنويًا في كل عدد: {{0.0050}} ، {{103}} ، {{2.10}} ، {{1200}} ؟',steps:['{{0.0050}}: الأصفار الأولى غير معنوية، أما {{5}} و{{0}} الأخيرة بعد الفاصلة فمعنويان، إذن رقمان.','{{103}}: الصفر بين رقمين معنويًا، إذن 3 أرقام.','{{2.10}}: الصفر الأخير بعد الفاصلة معنوي، إذن 3 أرقام.','{{1200}}: الأصفار في النهاية بلا فاصلة غير معنوية عادةً، فيعدّ رقمين معنويين (أو أكثر حسب الدقّة المعلنة).'],ans:'{{2 ، 3 ، 3 ، 2}}',id:'s-11-3'}],
tool:'round',toolTitle:'مدوِّر الأعداد',
practice:[
{id:'p-11-1',q:'دوّر {{3212}} إلى 3 أرقام معنوية.',o:['{{3200}}','{{3210}}','{{3 212}}','{{3220}}'],a:1,s:['نحتفظ بـ {{3 ، 2 ، 1}} ونحذف {{2}}.','الرقم المحذوف {{2}} < 5 فيبقى {{321}} ثم نملأ بصفر: {{3210}}.']},
{id:'p-11-2',q:'دوّر {{5678}} إلى 3 أرقام معنوية.',o:['{{5670}}','{{5700}}','{{5680}}','{{5600}}'],a:2,s:['نحتفظ بـ {{567}} والرقم المحذوف {{8}} ≥ 5.','نزيد {{7}} فتصبح {{568}} ثم صفر: {{5680}}.']},
{id:'p-11-3',q:'دوّر {{203 456}} إلى 3 أرقام معنوية.',o:['{{203 000}}','{{204 000}}','{{203 500}}','{{200 000}}'],a:0,s:['نحتفظ بـ {{203}} والرقم المحذوف {{4}} < 5.','يبقى {{203}} ثم نملأ الأصفار: {{203 000}}.']},
{id:'p-11-4',q:'دوّر {{25.995}} إلى منزلتين عشريتين.',o:['{{25.99}}','{{26.0}}','{{26.00}}','{{25.9}}'],a:2,s:['المنزلتان {{25.99}} والرقم المحذوف {{5}} ≥ 5 فنزيد {{99}} بمقدار 1.','{{25.99 + 0.01 = 26.00}} (نكتب الصفرين لأننا طلبنا منزلتين).']},
{id:'p-11-5',q:'دوّر {{3.567}} إلى منزلتين عشريتين.',o:['{{3.56}}','{{3.57}}','{{3.6}}','{{3.50}}'],a:1,s:['نحتفظ بـ {{3.56}} والرقم المحذوف {{7}} ≥ 5.','نزيد {{6}} فتصبح {{3.57}}.']},
{id:'p-11-6',q:'كم رقمًا معنويًا في العدد {{0.02040}} ؟',o:['{{3}}','{{4}}','{{5}}','{{2}}'],a:1,s:['الأصفار التي تسبق أول رقم غير صفري ({{0.0}}) غير معنوية.','الأرقام المعنوية: {{2 ، 0 ، 4 ، 0}}: الصفر الأوسط بين رقمين معنوي، والصفر الأخير بعد الفاصلة معنوي.','إذن 4 أرقام معنوية.']}
]},
{id:'i12',title:'متى نستخدم التدوير؟ وكيف نحدّد الدقّة المناسبة',
idea:[
'نُدوِّر لسببين: (1) لنعطي {{جوابًا محسوسًا}} له معنى عمليًا، (2) لنُظهر {{دقّة القياس}} فلا نكتب أرقامًا لا نستطيع قياسها فعلًا.',
'مثال على الجواب المحسوس: محيط طاولة {{345 cm}} ولكل شخص {{75 cm}}، فالحساب يعطي {{4.6}} شخصًا. القاعدة الرياضية تدوّره إلى 5 أشخاص، لكن الجلوس المريح لا يتّسع إلا لـ 4. فكّر دائمًا ماذا يعني جوابك عمليًا.',
'مثال على دقّة القياس: قياس ملعب {{110 m}} يعني أنه قيس لأقرب {{10 m}}. أما {{108.54 m}} فيعني قياسًا لأقرب سنتيمتر، وهذا غير معقول بشريط مترٍ واحد؛ الأنسب {{109 m}}.',
'عند ضرب أو قسمة قياسات، نُبقي في الجواب نفس عدد المنازل أو الأرقام المعنوية للعدد {{الأقل دقّة}} المستخدم في الحساب.'],
rules:[
'فكّر ماذا يعني الجواب قبل تدويره (الطاولة والأشخاص).',
'رجِّع الجواب إلى عدد الأرقام المعنوية لأقل الأعداد دقّة في الحساب.',
'إذا كان العدد قياسًا، فانظر كيف قيس وما دقّة أداة القياس.',
'قرّر مقدار الدقّة التي تحتاجها فعلًا (قد يكفي أقرب عشرة).'],
solved:[
{src:'من المادة التدريبية — 1.3',short:'الأشخاص حول الطاولة',q:'طاولة محيطها {{345 cm}} ويحتاج كل شخص إلى {{75 cm}}. كم شخصًا يجلس حولها عمليًا؟',steps:['{{345 ÷ 75 = 4.6}}','التدوير الرياضي يعطي 5، لكن 5 أشخاص يحتاجون {{375 cm}} وهو أكبر من المحيط.','الجواب المعقول: لا نستطيع تجاوز العدد الصحيح الأصغر.'],ans:'{{4}} أشخاص',id:'s-12-1'},
{src:'من المادة التدريبية — 1.4',short:'ضرب ثلاثة قياسات',q:'احسب {{2.1 × 3.45 × 1.3}} وأعطِ الجواب بالدقّة المناسبة.',steps:['{{2.1 × 3.45 × 1.3 = 9.4185}}','أقل الأعداد دقّة: {{2.1}} و{{1.3}} لكل منهما رقمان معنويان.','نُدوِّر الجواب إلى رقمين معنويين: {{9.4}}.'],ans:'{{9.4}}',id:'s-12-2'},
{src:'★ مثال من إعداد المكتب',short:'عدد الأرقام في جواب',q:'مصدر يعدّ {{4.56}} عدّة في الثانية ومدّة القياس {{1.2 s}}. احسب مجموع العدّات بدقّة مناسبة.',steps:['{{4.56 × 1.2 = 5.472}}','{{1.2}} له رقمان معنويان و{{4.56}} له ثلاثة، فالأقل دقّة رقمان.','نُدوّر إلى رقمين معنويين: {{5.5}}.'],ans:'{{5.5}}',id:'s-12-3'}],
practice:[
{id:'p-12-1',q:'اكتب {{15.6 m}} إلى أقرب متر.',o:['{{15 m}}','{{16 m}}','{{15.5 m}}','{{20 m}}'],a:1,s:['الجزء بعد الفاصلة {{0.6}} وهو أكبر من أو يساوي {{0.5}} فنزيد الجزء الصحيح.','نزيد {{15}} بمقدار 1 فتصبح {{16 m}}.']},
{id:'p-12-2',q:'اكتب {{123 m}} إلى أقرب عشرة أمتار.',o:['{{120 m}}','{{130 m}}','{{100 m}}','{{125 m}}'],a:0,s:['رقم الآحاد {{3}} < 5.','نبقي {{12}} عشرات: {{120 m}}.']},
{id:'p-12-3',q:'اكتب {{3567 m}} إلى أقرب ألف متر.',o:['{{3000 m}}','{{3500 m}}','{{4000 m}}','{{3600 m}}'],a:2,s:['رقم المئات {{5}} ≥ 5 فنزيد الألوف.','{{3 + 1 = 4}} آلاف: {{4000 m}}.']},
{id:'p-12-4',q:'احسب {{3.14 × 2.0}} بالدقّة المناسبة.',o:['{{6.28}}','{{6.3}}','{{6}}','{{6.280}}'],a:1,s:['{{3.14 × 2.0 = 6.28}}','العدد {{2.0}} له رقمان معنويان وهو الأقل دقّة.','نُدوّر إلى رقمين: {{6.3}}.']},
{id:'p-12-5',q:'قطعة طولها {{100 cm}} تُقص إلى أجزاء طول كلّ منها {{30 cm}}. كم قطعة كاملة نحصل عليها عمليًا؟',o:['{{3}}','{{4}}','{{3.3}}','{{3.33}}'],a:0,s:['{{100 ÷ 30 = 3.33}}','لا يمكن أخذ جزء من قطعة كاملة؛ نأخذ العدد الصحيح الأصغر.','الجواب: {{3}} قطع (والباقي {{10 cm}}).']}
]}
]},
/* ============ الفصل 2: الجبر ============ */
{id:'c2',no:2,title:'الجبر (Algebra)',sub:'بناء المعادلات وحلّها: كيف نجد المجهول ونعزله بخطوات منظّمة.',
committee:[
'كل قوانين الإشعاع (الاضمحلال، الجرعة، العدّ) معادلات تحتاج أن تعيد ترتيبها لتجد المجهول المطلوب.',
'ستتعلم قاعدة الميزان: ما تفعله في طرف تفعله في الطرف الآخر، وكيف تتعامل مع الكسور والأقواس.',
'الخطأ الأشهر: نسيان قسمة أو ضرب كل حدّ داخل القوس عند نقله إلى الطرف الآخر.'],
ideas:[
{id:'i21',title:'ماذا تعني المعادلة؟',
idea:[
'الجبر فرع من الرياضيات نستبدل فيه الكميات المجهولة بأحرف، ونبني {{معادلة}} تربط بين قيم معلومة وأخرى مجهولة. مثال: المعادلة {{y = b + 2}} تعني أن {{y}} أكبر من {{b}} دائمًا بمقدار 2.',
'مثال مشهور: تحويل الحرارة من مئوية {{C}} إلى فهرنهايت {{F}}: {{F = 1.8C + 32}}. العدد {{1.8}} لأن 100 جزء على المقياس المئوي تقابل 180 جزءًا على الفهرنهايتي، والعدد {{32}} لأن درجة تجمّد الماء {{0 °C}} تقابل {{32 °F}}.',
'يمكن بناء معادلة من وصف: عدّاد إشعاع تكون فيه الإبرة عند ضعف تيار الكاشف: {{x = 2c}}. وإذا بدأت الإبرة من العلامة 3 عندما يكون التيار صفرًا فالمعادلة {{x = 2c + 3}}.',
'طرق كتابة الضرب: {{2c}} و{{2.c}} و{{2*c}} كلها تعني {{2 × c}}. وكتابة {{2/a}} أو الكسر {{2 فوق a}} تعني {{2 ÷ a}}.'],
rules:[
'عندما يظهر حرف وعدد متجاوران فهما مضروبان: {{2c = 2 × c}}.',
'عندما يظهر عدد فوق آخر (كسر) فالأعلى هو البسط مقسوم على الأسفل (المقام).',
'نبني المعادلة من الوصف: «يساوي» ← {{=}} ، «ضعف» ← {{2×}} ، «مقسوم على» ← {{÷}}.'],
solved:[
{src:'من المادة التدريبية — 2.1',short:'25 مئوية بالفهرنهايت',q:'ماذا تعادل {{25 °C}} بالفهرنهايت؟',steps:['{{F = 1.8C + 32}}','نعوّض {{C = 25}}: {{F = 1.8 × 25 + 32}}','{{1.8 × 25 = 45}} ثم {{45 + 32 = 77}}.'],ans:'{{77 °F}}',id:'s-21-1'},
{src:'من المادة التدريبية — 2.1',short:'موضع الإبرة',q:'في العدّاد {{x = 2c + 3}} أوجد {{x}} عندما {{c = 1}} وعندما {{c = 2}}.',steps:['{{c = 1}}: {{x = 2 × 1 + 3 = 5}}','{{c = 2}}: {{x = 2 × 2 + 3 = 7}}'],ans:'{{5}} و{{7}}',id:'s-21-2'},
{src:'★ مثال من إعداد المكتب',short:'ماء يغلي',q:'احسب درجة غليان الماء {{100 °C}} بالفهرنهايت، ثم أوجد بالمئوية ما يقابل {{50 °F}}.',steps:['{{F = 1.8 × 100 + 32 = 212}}','لإيجاد {{C}} من {{F}}: {{C = (F − 32) / 1.8}}','{{C = (50 − 32) / 1.8 = 18 / 1.8 = 10}}'],ans:'{{212 °F}} و{{10 °C}}',id:'s-21-3'}],
tool:'eq',toolTitle:'محوّل الحرارة وحلّال المعادلة الخطية',
practice:[
{id:'p-21-1',q:'باستخدام {{F = 1.8C + 32}} ما قيمة {{F}} عندما {{C = 40}} ؟',o:['{{104}}','{{72}}','{{86}}','{{112}}'],a:0,s:['{{1.8 × 40 = 72}}','{{72 + 32 = 104}}']},
{id:'p-21-2',q:'في العدّاد {{x = 2c + 3}} ما قيمة {{x}} عندما {{c = 5}} ؟',o:['{{10}}','{{13}}','{{15}}','{{8}}'],a:1,s:['{{2 × 5 = 10}}','{{10 + 3 = 13}}']},
{id:'p-21-3',q:'اكتب بمعادلة: مستوى الإشعاع {{R}} يساوي نصف ناتج الوحدة {{O}} مقسومًا على عدد صفائح الماص {{p}}.',o:['{{R = O/(2p)}}','{{R = 2O/p}}','{{R = O/2 + p}}','{{R = O·p/2}}'],a:0,s:['نصف الناتج: {{O/2}}.','مقسومًا على {{p}}: {{(O/2)/p = O/(2p)}}.']}
]},
{id:'i22',title:'معالجة المعادلات (قاعدة الميزان)',
idea:[
'القاعدة الذهبية: {{ما تفعله بطرف المعادلة افعله بالطرف الآخر}} لتبقى المعادلة متوازنة.',
'لعزل {{2a}} في {{Y = 2a + 3d}} نطرح {{3d}} من الطرفين فنحصل على {{Y − 3d = 2a}} ثم نقسم على 2: {{a = (Y − 3d)/2}}.',
'إذا كان المجهول في بسط كسر {{S = 2a/(3d)}} نضرب الطرفين بالمقام {{3d}} فنحصل على {{3dS = 2a}} ثم نقسم على 2: {{a = 3dS/2}}.',
'إذا كان في المقام أكثر من حدّ مثل {{(3d + 2b)}} فضعه بين أقواس، وعند ضربه بالطرف الآخر اضرب كل حدّ داخل القوس: {{S(3d + 2b) = 3dS + 2bS}}.'],
rules:[
'نقل حدّ من طرف إلى الآخر يغيّر إشارته ({{+}} يصبح {{−}} والعكس).',
'مقام الكسر ينتقل إلى الطرف الآخر ليصبح {{مضروبًا}}، والبسط ينتقل ليصبح {{مقسومًا}}.',
'إذا كان البسط أو المقام فيه أكثر من حدّ مرتبط بـ {{+}} أو {{−}} فاحصرهما بأقواس وعالجهما كحدّ واحد.',
'عند الانتهاء: عوّض القيمة في المعادلة الأصلية للتحقّق.'],
solved:[
{src:'من المادة التدريبية — 2.2',short:'عزل a في S = 2a/(3d + 2b)',q:'ابدأ من {{S = 2a/(3d + 2b)}} واحسب {{b}} بدلالة {{a}} و{{S}} و{{d}}.',steps:['نضرب الطرفين بـ {{(3d + 2b)}}: {{S(3d + 2b) = 2a}}','نقسم الطرفين على {{S}}: {{3d + 2b = 2a/S}}','نطرح {{3d}} من الطرفين: {{2b = 2a/S − 3d}}','نقسم على 2: {{b = a/S − 3d/2}}'],ans:'{{b = a/S − 3d/2}}',id:'s-22-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 2',short:'a = b − 2c',q:'من المعادلة {{a = b − 2c}} أوجد: (أ) {{b}} بدلالة {{a}} و{{c}} (ب) {{c}} بدلالة {{a}} و{{b}}.',steps:['(أ) نضيف {{2c}} للطرفين: {{a + 2c = b}} إذن {{b = a + 2c}}.','(ب) نبدأ من {{a = b − 2c}} ونضيف {{2c}} ونطرح {{a}}: {{2c = b − a}}.','نقسم على 2: {{c = (b − a)/2}}.'],ans:'{{b = a + 2c}} و{{c = (b − a)/2}}',id:'s-22-2'},
{src:'من المادة التدريبية — الاختبار الذاتي 2',short:'قيمة b عدديًا',q:'أوجد {{b}} من {{b = (af − 3c − d)/2}} إذا كان {{a = 2 ، f = 3 ، c = 1 ، d = 4}}.',steps:['{{af = 2 × 3 = 6}}','البسط: {{6 − 3 × 1 − 4 = 6 − 3 − 4 = −1}}','{{b = −1/2 = −0.5}}'],ans:'{{−0.5}}',id:'s-22-3'}],
practice:[
{id:'p-22-1',q:'من {{Y = 2a + 3d}} ما قيمة {{a}} ؟',o:['{{a = (Y − 3d)/2}}','{{a = Y − 3d + 2}}','{{a = 2(Y − 3d)}}','{{a = (Y + 3d)/2}}'],a:0,s:['نطرح {{3d}}: {{Y − 3d = 2a}}.','نقسم على 2: {{a = (Y − 3d)/2}}.']},
{id:'p-22-2',q:'من {{S = 2a/(3d)}} إذا كان {{S = 4}} و{{d = 1}} فما قيمة {{a}} ؟',o:['{{6}}','{{12}}','{{3}}','{{8/3}}'],a:0,s:['{{a = 3dS/2}}','{{a = 3 × 1 × 4 / 2 = 6}}']},
{id:'p-22-3',q:'أوجد {{b}} من {{b = (af − 3c − d)/2}} إذا كان {{a = 4 ، f = 2 ، c = 1 ، d = 1}}.',o:['{{2}}','{{4}}','{{1}}','{{6}}'],a:0,s:['{{af = 8}}','البسط: {{8 − 3 − 1 = 4}}','{{b = 4/2 = 2}}']},
{id:'p-22-4',q:'ما الخطأ الشائع عند نقل الحدّ {{2b}} من الطرف الأيمن إلى الأيسر في {{x = 5 + 2b}} ؟',o:['نسيان تغيير إشارته فنكتب {{x + 2b = 5}}','تغيير إشارته فنكتب {{x − 2b = 5}}','قسمته على 5','إهماله'],a:0,s:['الصحيح: {{x − 2b = 5}} (نقل حدّ يغيّر إشارته).','الخطأ هو أن يبقى {{+2b}} بعد النقل.']}
]}
]},
/* ============ الفصل 3: الأسس والترميز العلمي ============ */
{id:'c3',no:3,title:'الأسس (القوى) والترميز العلمي',sub:'كتابة الأعداد الكبيرة والصغيرة جدًا بشكل مختصر وآمن من الأخطاء.',
committee:[
'في النشاط الإشعاعي تتعامل مع أعداد ضخمة (ذرّات بالمليارات) وصغيرة جدًا (طول الموجة)؛ الترميز العلمي يختصرها.',
'ستتعلم قواعد الأسس: الضرب، القسمة، القوة، الأس الكسري والصفري والسالب.',
'الخطأ الأشهر: تطبيق قواعد الجمع على أسس لها {{أساسات مختلفة}} مثل {{2^(3) × 3^(2)}}، فالقاعدة تنطبق فقط عند نفس الأساس.'],
ideas:[
{id:'i31',title:'قواعد الضرب والقسمة والقوة',
idea:[
'{{الأس}} (أو القوة أو الدليل) هو عدد مرات ضرب العدد بنفسه: {{2^(3) = 2 × 2 × 2 = 8}}. العدد {{2}} هو {{الأساس}} و{{3}} هو الأس. يُقرأ {{2^(2)}} «مربّع» و{{2^(3)}} «مكعّب».',
'عند ضرب قوتين لهما نفس الأساس نجمع الأسس: {{b^(m) × b^(n) = b^(m+n)}}.',
'عند رفع قوة إلى قوة نضرب الأسس: {{(b^(m))^(n) = b^(mn)}}.',
'عند قسمة قوتين لهما نفس الأساس نطرح الأسس: {{b^(m) ÷ b^(n) = b^(m−n)}}.'],
rules:[
'{{b^(m) × b^(n) = b^(m+n)}}  ← الضرب: اجمع الأسس.',
'{{b^(m) ÷ b^(n) = b^(m−n)}}  ← القسمة: اطرح الأسس.',
'{{(b^(m))^(n) = b^(m×n)}}  ← قوة القوة: اضرب الأسس.',
'تنطبق هذه القواعد فقط إذا كان الأساس {{نفسه}} في الطرفين.'],
solved:[
{src:'من المادة التدريبية — 3.1.1',short:'2² × 2³',q:'احسب {{2^(2) × 2^(3)}} بقاعدة الأسس ثم تحقق منها بالحساب المباشر.',steps:['الأساس واحد، نجمع الأسس: {{2^(2+3) = 2^(5)}}.','التحقق: {{2^(2) = 4}} و{{2^(3) = 8}} و{{4 × 8 = 32 = 2^(5)}}.'],ans:'{{32}}',id:'s-31-1'},
{src:'من المادة التدريبية — 3.1.1',short:'2⁵ ÷ 2²',q:'احسب {{2^(5) ÷ 2^(2)}}.',steps:['نطرح الأسس: {{2^(5−2) = 2^(3)}}.','التحقق: {{32 ÷ 4 = 8 = 2^(3)}}.'],ans:'{{8}}',id:'s-31-2'},
{src:'من المادة التدريبية — الاختبار الذاتي 3',short:'ضرب وقسمة بأسس سالبة',q:'اكتب كل جواب على شكل قوة: (أ) {{2^(3) × 2^(−4)}} (ب) {{2^(3) ÷ 2^(−4)}} (ج) {{b^(1/3) × b^(2/3)}}.',steps:['(أ) نجمع: {{3 + (−4) = −1}} فالجواب {{2^(−1)}}.','(ب) نطرح: {{3 − (−4) = 3 + 4 = 7}} فالجواب {{2^(7)}}.','(ج) نجمع: {{1/3 + 2/3 = 1}} فالجواب {{b^(1) = b}}.'],ans:'{{2^(−1) ، 2^(7) ، b}}',id:'s-31-3'}],
tool:'pow',toolTitle:'مختبر الأسس',
practice:[
{id:'p-31-1',q:'احسب {{3^(4)}}.',o:['{{12}}','{{64}}','{{81}}','{{27}}'],a:2,s:['{{3^(4) = 3 × 3 × 3 × 3}}','{{9 × 9 = 81}}']},
{id:'p-31-2',q:'بسّط {{c^(2) ÷ c^(a)}}.',o:['{{c^(2a)}}','{{c^(2−a)}}','{{c^(2+a)}}','{{c^(a−2)}}'],a:1,s:['القسمة: نطرح الأسس.','{{c^(2−a)}}']},
{id:'p-31-3',q:'قيمة {{(2^(2))^(3)}} تساوي:',o:['{{2^(5)}}','{{2^(6) = 64}}','{{2^(8)}}','{{12}}'],a:1,s:['قوة القوة: نضرب الأسس.','{{2^(2×3) = 2^(6) = 64}}']},
{id:'p-31-4',q:'بسّط {{5^(3) × 5^(2) ÷ 5^(4)}}.',o:['{{5}}','{{25}}','{{125}}','{{5^(9)}}'],a:0,s:['{{5^(3+2) = 5^(5)}}','{{5^(5−4) = 5^(1) = 5}}']}
]},
{id:'i32',title:'الأسس الكسرية والصفرية والسالبة',
idea:[
'الأس الكسري {{1/m}} يعني {{الجذر من المرتبة m}}: {{b^(1/m) = m√b}}. فمثلًا {{9^(1/2) = √9 = 3}} (جذر تربيعي) و{{8^(1/3) = 2}} (جذر تكعيبي) لأن {{2 × 2 × 2 = 8}}.',
'أي عدد (غير الصفر) مرفوع للأس صفر يساوي 1: {{b^(0) = 1}}. مثال {{10^(0) = 1}} و{{7^(0) = 1}}.',
'الأس السالب يعني {{مقلوب}} القوة الموجبة: {{b^(−p) = 1/b^(p)}}. مثال {{10^(−2) = 1/100 = 0.01}}.'],
rules:[
'{{b^(1/2) = √b}} و{{b^(1/3) = ∛b}} (الجذر التكعيبي).',
'{{b^(0) = 1}} لكل {{b ≠ 0}}.',
'{{b^(−p) = 1/b^(p)}} ← الأس السالب لا يجعل العدد سالبًا بل يجعله مقلوبًا.',
'{{10^(−1) = 0.1 ، 10^(−2) = 0.01 ، 10^(−3) = 0.001}}.'],
solved:[
{src:'من المادة التدريبية — الاختبار الذاتي 4',short:'16^(1/2) و7^0 و2^(-2)',q:'احسب: (أ) {{16^(1/2)}} (ب) {{7^(0)}} (ج) {{2^(−2)}}.',steps:['(أ) نصف الأس يعني الجذر التربيعي: {{√16 = 4}}.','(ب) أي عدد للأس صفر يساوي 1.','(ج) {{2^(−2) = 1/2^(2) = 1/4 = 0.25}}.'],ans:'{{4 ، 1 ، 0.25}}',id:'s-32-1'},
{src:'★ مثال من إعداد المكتب',short:'قوة كسرية مركّبة',q:'احسب {{27^(2/3)}}.',steps:['{{27^(2/3) = (27^(1/3))^(2)}}','الجذر التكعيبي لـ 27 هو {{3}} لأن {{3 × 3 × 3 = 27}}.','{{3^(2) = 9}}'],ans:'{{9}}',id:'s-32-2'},
{src:'★ مثال من إعداد المكتب',short:'قوى العدد 10 السالبة',q:'اكتب {{10^(−3)}} و{{10^(−5)}} على شكل أعداد عشرية.',steps:['{{10^(−3) = 1/10^(3) = 1/1000 = 0.001}}','{{10^(−5) = 1/100000 = 0.00001}}','القاعدة: الأس السالب {{−n}} يعني فاصلة عشرية يسبقها {{n−1}} أصفار ثم 1.'],ans:'{{0.001}} و{{0.00001}}',id:'s-32-3'}],
practice:[
{id:'p-32-1',q:'قيمة {{64^(1/3)}} تساوي:',o:['{{4}}','{{8}}','{{21.3}}','{{32}}'],a:0,s:['الجذر التكعيبي لـ 64.','{{4 × 4 × 4 = 64}} إذن {{4}}.']},
{id:'p-32-2',q:'قيمة {{5^(−2)}} تساوي:',o:['{{−25}}','{{−10}}','{{0.04}}','{{0.2}}'],a:2,s:['{{5^(−2) = 1/5^(2) = 1/25}}','{{1/25 = 0.04}}']},
{id:'p-32-3',q:'قيمة {{(−3)^(0) + 4^(1/2)}} تساوي:',o:['{{3}}','{{2}}','{{5}}','{{1}}'],a:0,s:['{{(−3)^(0) = 1}}','{{4^(1/2) = 2}}','المجموع {{1 + 2 = 3}}.']}
]},
{id:'i33',title:'الأساس 10 والترميز العلمي',
idea:[
'نظامنا العشري مبني على الأساس 10: {{10 × 10 = 10^(2) = 100}} و{{10^(3) = 1000}} وهكذا. (النظام الثنائي أساسه 2 في الإلكترونيات، والستعشري أساسه 16 في الحواسيب).',
'{{الترميز العلمي}}: نكتب العدد بحيث يكون رقم واحد غير صفري قبل الفاصلة، ثم نضرب بـ {{10}} مرفوعة للأس المناسب. مثل {{123 = 1.23 × 10^(2)}}.',
'للأعداد الأكبر من 10 يكون الأس {{موجبًا}}، وللأعداد الأصغر من 1 يكون الأس {{سالبًا}}. وطريقة سريعة: عدّ الخانات التي تحرّكت بها الفاصلة.',
'تكتب الحواسيب والجداول الترميز العلمي بالحرف E: {{1.25 × 10^(2) = 1.25E02}} و{{1.23 × 10^(−3) = 1.23E−03}}.'],
rules:[
'العدد الكبير: حرّك الفاصلة لليسار، الأس موجب بعدد الخانات: {{123 000 000 = 1.23 × 10^(8)}}.',
'العدد الصغير: حرّك الفاصلة لليمين، الأس سالب بعدد الخانات: {{0.0123 = 1.23 × 10^(−2)}}.',
'{{E}} تعني «× 10 أس»: {{3.57E04 = 3.57 × 10^(4)}}.'],
solved:[
{src:'من المادة التدريبية — 3.2',short:'أعداد بالترميز العلمي',q:'اكتب بالترميز العلمي: {{12.3}} ، {{0.123}} ، {{0.0000000000123}}.',steps:['{{12.3}}: الفاصلة تتحرك خانة لليسار: {{1.23 × 10^(1)}}.','{{0.123}}: تتحرك خانة لليمين: {{1.23 × 10^(−1)}}.','{{0.0000000000123}}: تتحرك 11 خانة لليمين: {{1.23 × 10^(−11)}}.'],ans:'{{1.23 × 10^(1) ، 1.23 × 10^(−1) ، 1.23 × 10^(−11)}}',id:'s-33-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 3',short:'3500 و23 و56784',q:'اكتب بالترميز العلمي: (أ) {{3 500}} (ب) {{23}} (ج) {{56 784}}.',steps:['(أ) {{3.5 × 10^(3)}}','(ب) {{2.3 × 10^(1)}}','(ج) {{5.6784 × 10^(4)}} وإذا طُلب بمنزلتين عشريتين فهو {{5.68 × 10^(4)}}.'],ans:'{{3.5 × 10^(3) ، 2.3 × 10^(1) ، 5.6784 × 10^(4)}}',id:'s-33-2'},
{src:'★ مثال من إعداد المكتب',short:'ضرب بالترميز العلمي',q:'احسب {{(3 × 10^(4)) × (2 × 10^(−6))}} واكتب الجواب بالترميز العلمي.',steps:['نضرب المعاملات: {{3 × 2 = 6}}.','نجمع الأسس: {{4 + (−6) = −2}}.','{{6 × 10^(−2) = 0.06}}'],ans:'{{6 × 10^(−2)}}',id:'s-33-3'}],
tool:'sci',toolTitle:'محوّل الترميز العلمي',
practice:[
{id:'p-33-1',q:'اكتب {{0.00045}} بالترميز العلمي.',o:['{{4.5 × 10^(−4)}}','{{4.5 × 10^(−3)}}','{{4.5 × 10^(4)}}','{{4.5 × 10^(−5)}}'],a:0,s:['الفاصلة تتحرك 4 خانات لليمين لتصبح بعد {{4}}.','فالأس {{−4}}.']},
{id:'p-33-2',q:'قيمة {{6.2E03}} تساوي:',o:['{{62}}','{{620}}','{{6200}}','{{0.0062}}'],a:2,s:['{{E03}} تعني {{× 10^(3)}}.','{{6.2 × 1000 = 6200}}']},
{id:'p-33-3',q:'اكتب {{123 000 000}} بالترميز العلمي.',o:['{{1.23 × 10^(6)}}','{{1.23 × 10^(7)}}','{{1.23 × 10^(8)}}','{{12.3 × 10^(8)}}'],a:2,s:['نحرّك الفاصلة 8 خانات لليسار.','{{1.23 × 10^(8)}}']},
{id:'p-33-4',q:'ما ناتج {{(2 × 10^(3)) ÷ (4 × 10^(5))}} بالترميز العلمي؟',o:['{{5 × 10^(−3)}}','{{0.5 × 10^(8)}}','{{5 × 10^(−2)}}','{{2 × 10^(−2)}}'],a:0,s:['{{2 ÷ 4 = 0.5}} و{{10^(3−5) = 10^(−2)}}.','{{0.5 × 10^(−2) = 5 × 10^(−3)}}.']}
]}
]},
/* ============ الفصل 4: مدخل إلى اللوغاريتمات ============ */
{id:'c4',no:4,title:'مدخل إلى اللوغاريتمات',sub:'ما هو اللوغاريتم؟ ولماذا يحوّل الضرب إلى جمع؟ وقواعده الخمس.',
committee:[
'قانون الاضمحلال الإشعاعي وعمر النصف لا يمكن حلّهما بدون لوغاريتمات؛ فهذا الفصل هو الأساس لكل ما بعده.',
'الفكرة المركزية: {{اللوغاريتم هو الأس}}. حين تسأل «ما لوغاريتم 1000؟» فأنت تسأل: أي أس نرفع إليه 10 لنحصل على 1000؟',
'الخطأ الأشهر: الاعتقاد بأن {{log(m + n) = log m + log n}}. الصحيح هو {{log(m × n) = log m + log n}} (الضرب هو الذي يتحول إلى جمع).'],
ideas:[
{id:'i41',title:'ما هو اللوغاريتم؟',
idea:[
'نكتب أي عدد {{y}} على صورة أساس {{b}} مرفوع إلى أس {{x}}: {{y = b^(x)}}. عندئذٍ {{لوغاريتم y للأساس b}} يساوي {{x}}، ونكتب {{log_(b) y = x}}.',
'بكلمات أخرى: {{اللوغاريتم هو الأس الذي يجب أن نرفع إليه الأساس للحصول على العدد.}}',
'مثال: {{1000 = 10^(3)}} إذن {{log_(10) 1000 = 3}}. ومثال آخر: {{8 = 2^(3)}} إذن {{log_(2) 8 = 3}}.',
'كان الهدف الأصلي منه تسهيل الحسابات: الجمع أسهل من الضرب، والطرح أسهل من القسمة. اليوم تحسب الآلة الحاسبة، لكن فهم اللوغاريتم ضروري في الوقاية من الإشعاع لأنه يؤسّس لقانون التفكك الإشعاعي.'],
rules:[
'{{y = b^(x)}} ⇔ {{log_(b) y = x}} (جملتان تعنيان الشيء نفسه).',
'{{log_(b) b = 1}} لأن {{b^(1) = b}}.',
'{{log_(b) 1 = 0}} لأن {{b^(0) = 1}}.',
'اللوغاريتم معرَّف فقط للأعداد {{الموجبة}}.'],
solved:[
{src:'من المادة التدريبية — الاختبار الذاتي 4',short:'log10 لـ 1 و10 و100',q:'استخدم التعريف لحساب: (أ) {{log_(10) 1}} (ب) {{log_(10) 10}} (ج) {{log_(10) 100}}.',steps:['(أ) {{1 = 10^(0)}} إذن {{log_(10) 1 = 0}}.','(ب) {{10 = 10^(1)}} إذن {{log_(10) 10 = 1}}.','(ج) {{100 = 10^(2)}} إذن {{log_(10) 100 = 2}}.'],ans:'{{0 ، 1 ، 2}}',id:'s-41-1'},
{src:'★ مثال من إعداد المكتب',short:'لوغاريتمات بأساسات مختلفة',q:'احسب: (أ) {{log_(2) 32}} (ب) {{log_(3) 81}} (ج) {{log_(10) 0.01}}.',steps:['(أ) {{32 = 2^(5)}} إذن {{5}}.','(ب) {{81 = 3^(4)}} إذن {{4}}.','(ج) {{0.01 = 10^(−2)}} إذن {{−2}}.'],ans:'{{5 ، 4 ، −2}}',id:'s-41-2'},
{src:'★ مثال من إعداد المكتب',short:'ما العدد؟',q:'إذا كان {{log_(10) y = 3}} فما قيمة {{y}} ؟ وإذا كان {{log_(2) y = 6}} فما قيمة {{y}} ؟',steps:['{{log_(10) y = 3}} تعني {{y = 10^(3) = 1000}}.','{{log_(2) y = 6}} تعني {{y = 2^(6) = 64}}.'],ans:'{{1000}} و{{64}}',id:'s-41-3'}],
tool:'logt',toolTitle:'مستكشف اللوغاريتمات وقواعدها',
practice:[
{id:'p-41-1',q:'احسب {{log_(10) 10000}}.',o:['{{3}}','{{4}}','{{5}}','{{10}}'],a:1,s:['{{10000 = 10^(4)}}.','إذن اللوغاريتم {{4}}.']},
{id:'p-41-2',q:'احسب {{log_(2) 32}}.',o:['{{16}}','{{4}}','{{5}}','{{6}}'],a:2,s:['{{2 × 2 × 2 × 2 × 2 = 32}}.','أي {{2^(5) = 32}} إذن {{5}}.']},
{id:'p-41-3',q:'احسب {{log_(10) 0.001}}.',o:['{{3}}','{{−3}}','{{−2}}','{{0.3}}'],a:1,s:['{{0.001 = 10^(−3)}}.','إذن {{−3}}.']},
{id:'p-41-4',q:'إذا كان {{log_(5) y = 2}} فإن {{y}} يساوي:',o:['{{10}}','{{25}}','{{7}}','{{32}}'],a:1,s:['{{y = 5^(2)}}','{{= 25}}']}
]},
{id:'i42',title:'قواعد اللوغاريتمات واللوغاريتمان العشري والطبيعي',tool:'logt',toolTitle:'اختبر القواعد بأعدادك',
idea:[
'قواعد القوى لها نظائر لوغاريتمية: الضرب يصير جمعًا، والقسمة تصير طرحًا، والقوة تصير ضربًا. ولا بدّ أن يكون {{الأساس واحدًا}} في كل المعادلة.',
'أكثر أساسين استخدامًا: الأساس {{10}} (نظامنا العادي) ويسمّى {{اللوغاريتم العشري}} ويُكتب {{log}}، والأساس {{e ≈ 2.718}} ويسمّى {{اللوغاريتم الطبيعي}} ويُكتب {{ln}}.',
'العدد {{e}} له أهمية خاصة في الوقاية الإشعاعية لأنه يظهر في معادلات التفكك الإشعاعي.'],
rules:[
'{{log_(b) b = 1}}',
'{{log_(b)(m × n) = log_(b) m + log_(b) n}}  ← الضرب ⇒ جمع',
'{{log_(b)(m ÷ n) = log_(b) m − log_(b) n}}  ← القسمة ⇒ طرح',
'{{log_(b)(m^(n)) = n × log_(b) m}}  ← القوة ⇒ ضرب',
'{{log_(b)(1/m) = −log_(b) m}}  ← المقلوب ⇒ إشارة سالبة',
'{{log}} بدون أساس = أساس 10 ، و{{ln}} = أساس {{e}}.'],
solved:[
{src:'من المادة التدريبية — الاختبار الذاتي 4',short:'log لـ 300 و27 و0.03 و1/3',q:'إذا كان {{log 3 = 0.4771}} فاحسب: (أ) {{log(3 × 100)}} (ب) {{log 3^(3)}} (ج) {{log(3 ÷ 100)}} (د) {{log(1/3)}}.',steps:['(أ) {{log 3 + log 100 = 0.4771 + 2 = 2.4771}}.','(ب) {{3 × log 3 = 3 × 0.4771 = 1.4313}}.','(ج) {{log 3 − log 100 = 0.4771 − 2 = −1.5229}}.','(د) {{−log 3 = −0.4771}}.'],ans:'{{2.4771 ، 1.4313 ، −1.5229 ، −0.4771}}',id:'s-42-1'},
{src:'★ مثال من إعداد المكتب',short:'من log 2 إلى لوغاريتمات أخرى',q:'إذا كان {{log 2 = 0.3010}} فاحسب {{log 8}} و{{log 5}} و{{log 200}}.',steps:['{{log 8 = log 2^(3) = 3 × 0.3010 = 0.9030}}.','{{log 5 = log(10 ÷ 2) = 1 − 0.3010 = 0.6990}}.','{{log 200 = log 2 + log 100 = 0.3010 + 2 = 2.3010}}.'],ans:'{{0.9030 ، 0.6990 ، 2.3010}}',id:'s-42-2'},
{src:'★ مثال من إعداد المكتب',short:'ما الأساسان الأكثر استخدامًا؟',q:'ما الأساسان الأكثر استخدامًا في اللوغاريتمات؟ وكيف يُكتب كل منهما؟',steps:['الأساس {{10}}: اللوغاريتم العشري ويُكتب {{log}}.','الأساس {{e ≈ 2.718}}: اللوغاريتم الطبيعي (أو النبيري) ويُكتب {{ln}}.'],ans:'{{10}} و{{e}}',id:'s-42-3'}],
practice:[
{id:'p-42-1',q:'إذا كان {{log 3 = 0.4771}} فإن {{log 30}} يساوي:',o:['{{1.4771}}','{{3.4771}}','{{0.4771 × 10}}','{{2.4771}}'],a:0,s:['{{log 30 = log 3 + log 10}}','{{0.4771 + 1 = 1.4771}}']},
{id:'p-42-2',q:'إذا كان {{log 2 = 0.3010}} فإن {{log 16}} يساوي:',o:['{{1.2040}}','{{0.6020}}','{{0.9030}}','{{4.3010}}'],a:0,s:['{{16 = 2^(4)}}.','{{log 16 = 4 × 0.3010 = 1.2040}}.']},
{id:'p-42-3',q:'أيّ العبارات التالية صحيحة دائمًا؟',o:['{{log(m + n) = log m + log n}}','{{log(m × n) = log m + log n}}','{{log(m × n) = log m × log n}}','{{log(m^(n)) = (log m)^(n)}}'],a:1,s:['الضرب يتحول إلى جمع: {{log(mn) = log m + log n}}.','العبارات الأخرى خاطئة (أمثلة: {{log(10 + 10) ≠ 2}}).']},
{id:'p-42-4',q:'إذا كان {{log 5 = 0.6990}} فإن {{log 0.5}} يساوي:',o:['{{−0.3010}}','{{−0.6990}}','{{0.3010}}','{{0.0699}}'],a:0,s:['{{0.5 = 5/10}} إذن {{log 0.5 = log 5 − log 10}}.','{{0.6990 − 1 = −0.3010}}.']}
]}
]},
/* ============ الفصل 5: اللوغاريتمات العشرية ============ */
{id:'c5',no:5,title:'اللوغاريتمات العشرية (Common Logs)',sub:'إيجاد اللوغاريتم العشري ومقابله، والحساب بالجداول (الضرب والقسمة).',
committee:[
'تحتاج أن تعرف الطريقتين: بالآلة الحاسبة (الأسهل) وبالجداول اللوغاريتمية (لمن لا تتوافر له آلة علمية أو لفهم الفكرة).',
'ستتعلم تقسيم اللوغاريتم إلى {{جزء صحيح}} ({{العدد البياني}}) و{{جزء عشري}} ({{الجزء العشري}}) وكيف تكتب لوغاريتم عدد أصغر من 1.',
'سترى كيف يتحول ضرب أعداد كبيرة إلى عملية جمع بسيطة في ثلاث مراحل.'],
ideas:[
{id:'i51',title:'إيجاد اللوغاريتم العشري لعدد',
idea:[
'اللوغاريتمات العشرية هي لوغاريتمات للأساس 10 وتُكتب {{log y = x}}. على الآلة الحاسبة العلمية اضغط الزر {{log}} ثم العدد (أو العكس بحسب الآلة).',
'طريقة الجداول: نكتب العدد بالترميز العلمي {{a × 10^(n)}} حيث {{1 ≤ a < 10}}. الأس {{n}} هو {{الجزء الصحيح}} من اللوغاريتم، ونأخذ {{الجزء العشري}} من الجدول عند {{a}} (الصف: الرقم الأول والفاصلة، العمود: المنزلة الثانية).',
'مثال: {{123.4 = 1.234 × 10^(2)}}. الجزء الصحيح {{2}}. من الجدول {{log 1.23 = 0.0899}} و{{log 1.24 = 0.0934}} فنستوفي لـ {{1.234}} (أي 0.4 من المسافة): {{0.0899 + 0.4 × 0.0035 ≈ 0.0913}}. إذن {{log 123.4 ≈ 2.0913}}. (يذكر الكتاب {{2.0915}} بسبب التقريب؛ والفرق صغير ولا يؤثر في الاستنتاج).',
'للأعداد الأصغر من 1 يكون الجزء الصحيح سالبًا والجزء العشري موجبًا دائمًا، فنكتبه بخط فوق الجزء الصحيح: {{log 0.1234 = ~(1).0913}} ومعناه {{−1 + 0.0913 = −0.9087}}.'],
rules:[
'لـ {{12.34 ، 123.4 ، 1.234 ، 0.1234}} نفس {{الجزء العشري}} لأن الفاصلة لا تؤثر فيه؛ يختلف الجزء الصحيح فقط.',
'{{log 123.4 = 2.0913 ، log 12.34 = 1.0913 ، log 1.234 = 0.0913 ، log 0.1234 = ~(1).0913}}',
'العدد الأصغر من 1 ⇒ لوغاريتمه سالب. العدد 1 ⇒ صفر. العدد الأكبر من 1 ⇒ موجب.',
'مثال التحقّق: {{log 1 = 0 ، log 10 = 1 ، log 100 = 2}}.'],
solved:[
{src:'من المادة التدريبية — الاختبار الذاتي 5',short:'log 4567 و log 1.09',q:'أوجد بالآلة الحاسبة: (أ) {{log 4567}} (ب) {{log 1.09}}.',steps:['(أ) {{4567 = 4.567 × 10^(3)}} فالجزء الصحيح {{3}}.','الآلة تعطي {{log 4567 = 3.6596}}.','(ب) {{log 1.09 = 0.0374}} (لأن {{1.09}} بين 1 و10 فالجزء الصحيح 0).'],ans:'{{3.6596}} و{{0.0374}}',id:'s-51-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 10',short:'log 125 و log 0.00897',q:'أوجد {{log 125}} و{{log 0.00897}} واكتب الثاني بصيغة الخط فوق الجزء الصحيح.',steps:['{{log 125 = 2.0969}}.','{{0.00897 = 8.97 × 10^(−3)}} فالجزء الصحيح {{−3}}.','{{log 8.97 = 0.9528}} إذن {{log 0.00897 = ~(3).9528}}.','القيمة العادية: {{−3 + 0.9528 = −2.0472}}.'],ans:'{{2.0969}} و{{~(3).9528 = −2.0472}}',id:'s-51-2'},
{src:'★ مثال من إعداد المكتب',short:'تقدير بدون آلة',q:'قدّر بين أي عددين صحيحين يقع {{log 5000}} دون آلة حاسبة.',steps:['{{1000 < 5000 < 10000}}.','{{log 1000 = 3}} و{{log 10000 = 4}}.','إذن {{3 < log 5000 < 4}} (والقيمة الدقيقة {{3.699}}).'],ans:'بين {{3}} و{{4}}',id:'s-51-3'}],
tool:'logtab',toolTitle:'اللوغاريتم العشري ومقابله بطريقة الجداول',
practice:[
{id:'p-51-1',q:'أوجد {{log 4567}} بالآلة الحاسبة (بأربع منازل عشرية).',o:['{{3.6596}}','{{4.6596}}','{{2.6596}}','{{0.6596}}'],a:0,s:['{{4567 = 4.567 × 10^(3)}} فالجزء الصحيح {{3}}.','{{log 4.567 = 0.6596}} إذن {{3.6596}}.']},
{id:'p-51-2',q:'أيّ العبارات صحيحة لـ {{log 0.4567}}؟',o:['{{log 0.4567 = ~(1).6596}}','{{log 0.4567 = 0.6596}}','{{log 0.4567 = 1.6596}}','{{log 0.4567 = −0.6596}}'],a:0,s:['{{0.4567 = 4.567 × 10^(−1)}} فالجزء الصحيح {{−1}}.','الجزء العشري {{0.6596}} موجب دائمًا: {{~(1).6596 = −1 + 0.6596 = −0.3404}}.']},
{id:'p-51-3',q:'ما القيمة التقريبية لـ {{log 2000}}؟',o:['{{2.301}}','{{3.301}}','{{0.301}}','{{4.301}}'],a:1,s:['{{2000 = 2 × 10^(3)}}.','{{log 2 + 3 = 0.301 + 3 = 3.301}}.']},
{id:'p-51-4',q:'{{log 0.01}} يساوي:',o:['{{−2}}','{{2}}','{{−1}}','{{0.01}}'],a:0,s:['{{0.01 = 10^(−2)}}.']}
]},
{id:'i52',title:'مقابل اللوغاريتم العشري (Antilog)',tool:'logtab',toolTitle:'اللوغاريتم ومقابله بالجداول',
idea:[
'أحيانًا نعرف قيمة اللوغاريتم ونريد العودة إلى العدد نفسه. هذا هو {{مقابل اللوغاريتم}} ويُرمز {{log^(−1)}}: {{y = log^(−1) x ⇔ y = 10^(x)}}.',
'على الآلة الحاسبة: زر {{shift}} (أو {{inv}}) ثم زر {{log}}. وبطريقة الجداول: افصل الجزء الصحيح (يصبح أسّ العدد 10) عن الجزء العشري، وابحث عن الجزء العشري {{داخل الجدول}} (لا في العمود الجانبي) لتجد العدد {{a}}، ثم اكتب {{a × 10^(n)}}.',
'مثال: {{log^(−1) 2.0915 = 1.235 × 10^(2)}}، لأن الجزء الصحيح {{2}} والجزء العشري {{0.0915}} يقابل {{1.235}} تقريبًا.'],
rules:[
'{{log^(−1) 0 = 1}} و{{log^(−1) 1 = 10}} و{{log^(−1) 2 = 100}}.',
'الجزء الصحيح هو {{أس العدد 10}}، والجزء العشري يعطينا الرقم {{a}} من 1 إلى 10.',
'إذا كان اللوغاريتم سالبًا فحوّله أولًا إلى جزء صحيح سالب وجزء عشري موجب: {{−0.3404 = ~(1).6596}}.'],
solved:[
{src:'من المادة التدريبية — 5.4',short:'مقابل log لـ 0 و1 و2',q:'احسب {{log^(−1) 0}} و{{log^(−1) 1}} و{{log^(−1) 2}}.',steps:['{{10^(0) = 1}}','{{10^(1) = 10}}','{{10^(2) = 100}}'],ans:'{{1 ، 10 ، 100}}',id:'s-52-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 11',short:'مقابل log لـ 3.657 و ~1.657',q:'أوجد {{log^(−1) 3.657}} و{{log^(−1) ~(1).657}}.',steps:['{{3.657}}: الجزء الصحيح {{3}} والعشري {{0.657}}. {{10^(0.657) = 4.539}}.','إذن {{log^(−1) 3.657 = 4.539 × 10^(3) ≈ 4539}}.','{{~(1).657}}: الجزء الصحيح {{−1}} والعشري {{0.657}}.','إذن {{log^(−1) ~(1).657 = 4.539 × 10^(−1) = 0.4539}}.'],ans:'{{4.539 × 10^(3)}} و{{4.539 × 10^(−1)}}',id:'s-52-2'},
{src:'من المادة التدريبية — الاختبار الذاتي 5',short:'مقابل log لـ 3.5482 و1.4114',q:'أوجد بالآلة {{log^(−1) 3.5482}} و{{log^(−1) 1.4114}}.',steps:['{{10^(3.5482) = 3.533 × 10^(3)}}.','{{10^(1.4114) = 25.79}}.'],ans:'{{3533}} و{{25.79}}',id:'s-52-3'}],
practice:[
{id:'p-52-1',q:'أوجد {{log^(−1) 2.5}} (أي {{10^(2.5)}}).',o:['{{250}}','{{316.2}}','{{25}}','{{105}}'],a:1,s:['{{10^(2.5) = 10^(2) × 10^(0.5) = 100 × 3.162}}','{{= 316.2}}']},
{id:'p-52-2',q:'{{log^(−1)(−1)}} يساوي:',o:['{{−10}}','{{0.1}}','{{1}}','{{10}}'],a:1,s:['{{10^(−1) = 1/10 = 0.1}}.']},
{id:'p-52-3',q:'إذا كان {{log y = 1.4114}} فإن {{y}} يساوي تقريبًا:',o:['{{14.11}}','{{25.79}}','{{141.1}}','{{2.579}}'],a:1,s:['{{y = 10^(1.4114)}}.','الجزء الصحيح {{1}} والعشري {{0.4114 → 2.579}} إذن {{2.579 × 10 = 25.79}}.']}
]},
{id:'i53',title:'الحساب بالجداول: الضرب والقسمة باللوغاريتمات',
idea:[
'نحوّل الضرب إلى جمع والقسمة إلى طرح عبر ثلاث مراحل:',
'{{المرحلة 1:}} نطبّق قاعدة اللوغاريتم ونكتب لوغاريتم كل عدد (بعد كتابته بالترميز العلمي).',
'{{المرحلة 2:}} نجمع (للضرب) أو نطرح (للقسمة) قيمتي اللوغاريتم.',
'{{المرحلة 3:}} نأخذ مقابل اللوغاريتم للناتج فنحصل على الجواب.',
'مثال: {{1350 × 350}}: {{log 1350 = 3.1303}} و{{log 350 = 2.5441}}. المجموع {{5.6744}}. مقابله: {{log^(−1) 5.6744 = 4.725 × 10^(5)}}. (التحقق: {{1350 × 350 = 472 500}}).'],
rules:[
'للضرب: {{log(a × b) = log a + log b}} ثم {{log^(−1)}}.',
'للقسمة: {{log(a ÷ b) = log a − log b}} ثم {{log^(−1)}}.',
'عند الطرح مع جزء صحيح سالب انتبه: {{~(1).2430 − 2.5378 = ~(4).7052}} ({{−1 + 0.2430 − 2.5378 = −3.2948 = −4 + 0.7052}}).',
'تحقّق دائمًا بتقدير سريع: {{1350 × 350 ≈ 1000 × 400 = 4×10^(5)}} (قريب من {{4.7×10^(5)}}).'],
solved:[
{src:'من المادة التدريبية — الملحق A مثال 3',short:'1350 × 350',q:'احسب {{1350 × 350}} باستخدام اللوغاريتمات العشرية.',steps:['{{1350 = 1.350 × 10^(3)}} و{{350 = 3.50 × 10^(2)}}.','{{log 1350 = 3 + 0.1303 = 3.1303}} و{{log 350 = 2 + 0.5441 = 2.5441}}.','{{log(1350 × 350) = 3.1303 + 2.5441 = 5.6744}}.','{{log^(−1) 5.6744 = 4.725 × 10^(5)}}.'],ans:'{{4.725 × 10^(5)}} (أي {{472 500}})',id:'s-53-1'},
{src:'من المادة التدريبية — الملحق A مثال 4',short:'0.175 ÷ 345',q:'احسب {{0.175 ÷ 345}} باستخدام اللوغاريتمات.',steps:['{{0.175 = 1.75 × 10^(−1)}} و{{345 = 3.45 × 10^(2)}}.','{{log 0.175 = ~(1).2430}} (أي {{−1 + 0.2430}}) و{{log 345 = 2.5378}}.','{{log(0.175 ÷ 345) = ~(1).2430 − 2.5378 = −1 + 0.2430 − 2.5378 = −3.2948 = ~(4).7052}}.','{{log^(−1) ~(4).7052 = 5.072 × 10^(−4)}}.'],ans:'{{5.072 × 10^(−4)}}',id:'s-53-2'},

/* ============ الفصل 6: اللوغاريتمات الطبيعية ============ */
{id:'c6',no:6,title:'اللوغاريتمات الطبيعية (Natural Logs)',sub:'اللوغاريتم للأساس e: ln ومقابله، واستخدام الجداول للأعداد الكبيرة والصغيرة.',
committee:[
'اللوغاريتم الطبيعي {{ln}} هو الذي تظهر فيه معادلات الاضمحلال الإشعاعي وعمر النصف.',
'ستتعلم أن {{ln}} يعمل بنفس قواعد {{log}} لكن أساسه {{e ≈ 2.718}}، وأن مقابله هو {{e^(x)}}.',
'نقطة الربط مع {{log}}: {{log N = 0.4343 × ln N}} أو {{ln N = 2.3026 × log N}}.'],
ideas:[
{id:'i61',title:'اللوغاريتم الطبيعي ln ومقابله',tool:'lnt',toolTitle:'ln و e^x',
idea:[
'اللوغاريتم الطبيعي (النبيري) هو اللوغاريتم للأساس {{e ≈ 2.718}} ويُكتب {{ln}}. فمثلًا {{log_(e) 3 = ln 3}}. وتُكتب معادلاته: {{ln y = x}} أي {{y = e^(x)}}.',
'على الآلة: زر {{ln}} للعدد. ولإيجاد المقابل {{ln^(−1)}} اضغط {{shift}} ثم {{ln}} (وسيظهر {{e^(x)}} فوق الزر).',
'قواعد {{ln}} هي نفس قواعد {{log}}: {{ln(mn) = ln m + ln n}} و{{ln(m^(k)) = k ln m}} و{{ln e = 1}}.',
'ربط بين اللوغاريتمين: {{ln N = 2.3026 × log N}} لأن {{ln 10 = 2.3026}}.'],
rules:[
'{{ln 1 = 0 ، ln 10 = 2.3026 ، ln 100 = 4.6052}}.',
'{{ln^(−1) 0 = 1 ، ln^(−1) 2.3026 = 10 ، ln^(−1) 4.6052 = 100}}.',
'{{ln e = 1}} و{{ln e^(x) = x}}.',
'{{y = ln^(−1) x}} تعني {{y = e^(x)}}.'],
solved:[
{src:'من المادة التدريبية — الاختبار الذاتي 6',short:'ln 4.65 و ln 46.5',q:'أوجد {{ln 4.65}} و{{ln 46.5}}.',steps:['{{ln 4.65 = 1.5369}} (الآلة).','{{46.5 = 4.65 × 10}} إذن {{ln 46.5 = ln 4.65 + ln 10 = 1.5369 + 2.3026 = 3.8395}}.'],ans:'{{1.5369}} و{{3.8395}}',id:'s-61-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 6',short:'مقابل ln لـ 0.693 و2.708',q:'أوجد {{ln^(−1) 0.693}} و{{ln^(−1) 2.708}}.',steps:['{{e^(0.693) = 2.000}}  (لأن {{ln 2 = 0.693}}).','{{e^(2.708) = 15.0}}  (لأن {{ln 15 = 2.708}}).'],ans:'{{2.000}} و{{15.0}}',id:'s-61-2'},
{src:'من المادة التدريبية — 6.2',short:'ln 1 و ln 10 و ln 100',q:'احسب {{ln 1}} و{{ln 10}} و{{ln 100}} بالآلة، وتحقق من العلاقة بينها.',steps:['{{ln 1 = 0}}','{{ln 10 = 2.3026}}','{{ln 100 = ln 10^(2) = 2 × 2.3026 = 4.6052}}'],ans:'{{0 ، 2.3026 ، 4.6052}}',id:'s-61-3'}],
practice:[
{id:'p-61-1',q:'إذا كان {{ln 2 = 0.693}} فإن {{ln 8}} يساوي:',o:['{{2.079}}','{{1.386}}','{{4.158}}','{{0.231}}'],a:0,s:['{{8 = 2^(3)}}.','{{ln 8 = 3 × 0.693 = 2.079}}.']},
{id:'p-61-2',q:'{{ln e^(5)}} يساوي:',o:['{{e}}','{{5}}','{{5e}}','{{1}}'],a:1,s:['{{ln e^(x) = x}}.','إذن {{5}}.']},
{id:'p-61-3',q:'{{ln^(−1) 1}} (أي {{e^(1)}}) يساوي تقريبًا:',o:['{{1}}','{{2.718}}','{{10}}','{{0.368}}'],a:1,s:['{{e^(1) = e ≈ 2.718}}.']},
{id:'p-61-4',q:'ما قيمة {{ln 100}} إذا كان {{log 100 = 2}}؟',o:['{{4.605}}','{{2}}','{{0.869}}','{{9.21}}'],a:0,s:['{{ln N = 2.3026 × log N}}.','{{2.3026 × 2 = 4.6052}}.']}
]},
{id:'i62',title:'جداول اللوغاريتم الطبيعي: الأعداد الكبيرة والصغيرة',tool:'lnt',toolTitle:'ln و e^x بطريقة الجداول',
idea:[
'جداول {{ln}} تغطي الأعداد من {{1.00}} إلى {{9.99}} فقط. لأي عدد خارج المجال: اكتبه بالترميز العلمي {{a × 10^(k)}} ثم استخدم القاعدة: {{ln N = ln a + k × ln 10}} حيث {{ln 10 = 2.3026}}.',
'مثال: {{38.5 = 3.85 × 10}} إذن {{ln 38.5 = ln 3.85 + ln 10 = 1.3481 + 2.3026 = 3.6507}}.',
'مثال للأعداد الصغيرة: {{ln 0.0679 = ln 6.79 − ln 10^(2) = 1.9155 − 4.6052 = −2.6897}}.'],
rules:[
'{{ln 10 = 2.3026 ، ln 10^(2) = 4.6052 ، ln 10^(3) = 6.9078 ، ln 10^(4) = 9.2103}}.',
'{{ln(a × 10^(k)) = ln a + k ln 10}} للأعداد الكبيرة والصغيرة (k سالب للصغيرة).',
'للتحويل بين اللوغاريتمين: {{log N = 0.4343 × ln N}}.'],
solved:[
{src:'من المادة التدريبية — الملحق B مثال 2',short:'ln 38.5',q:'أوجد {{ln 38.5}} بالجداول.',steps:['{{38.5 = 3.85 × 10}}.','{{ln 3.85 = 1.3481}} (من الجدول) و{{ln 10 = 2.3026}}.','{{ln 38.5 = 1.3481 + 2.3026 = 3.6507}}.'],ans:'{{3.6507}}',id:'s-62-1'},
{src:'من المادة التدريبية — الملحق B',short:'ln 679 و ln 0.0679',q:'أوجد {{ln 679}} و{{ln 0.0679}} بالجداول.',steps:['{{679 = 6.79 × 10^(2)}} و{{ln 6.79 = 1.9155}}.','{{ln 679 = 1.9155 + 4.6052 = 6.5207}}.','{{0.0679 = 6.79 × 10^(−2)}} فنطرح: {{1.9155 − 4.6052 = −2.6897}}.'],ans:'{{6.5207}} و{{−2.6897}}',id:'s-62-2'},
{src:'من المادة التدريبية — الاختبار الذاتي 13',short:'ln 465',q:'أوجد {{ln 465}} بالجداول (علمًا أن {{ln 4.65 = 1.5369}}).',steps:['{{465 = 4.65 × 10^(2)}}.','{{ln 465 = 1.5369 + 4.6052 = 6.1421}}.'],ans:'{{6.1421}} (والآلة تعطي {{6.1420}})',id:'s-62-3'}],
practice:[
{id:'p-62-1',q:'احسب {{ln 56}} علمًا أن {{ln 5.6 = 1.7228}}.',o:['{{4.0254}}','{{17.228}}','{{2.3026}}','{{3.8404}}'],a:0,s:['{{56 = 5.6 × 10}}.','{{ln 56 = 1.7228 + 2.3026 = 4.0254}}.']},
{id:'p-62-2',q:'أوجد {{ln 3.85}} من العلاقة {{log 3.85 = 0.5855}}.',o:['{{1.348}}','{{0.254}}','{{2.302}}','{{5.855}}'],a:0,s:['{{ln N = 2.3026 × log N}}.','{{2.3026 × 0.5855 = 1.3482}}.']},
{id:'p-62-3',q:'أوجد {{ln 0.01}}.',o:['{{−4.605}}','{{4.605}}','{{−2}}','{{−0.01}}'],a:0,s:['{{0.01 = 10^(−2)}}.','{{ln 0.01 = −2 × 2.3026 = −4.6052}}.']}
]}
]},
/* ============ الفصل 7: الدوال الأسية ============ */
{id:'c7',no:7,title:'الدوال الأسية (Exponential Functions)',sub:'الدالة e^x وعلاقتها بـ ln، وطريقة حلّ المعادلات الأسية.',
committee:[
'الاضمحلال الإشعاعي يُكتب بدالة أسية {{N = N_(0) e^(−λt)}}؛ ولن تفهمه ما لم تتقن {{e^(x)}} وعلاقتها بـ {{ln}}.',
'القاعدة الأهم في الفصل: {{ln e^(x) = x}}. استخدمها لتفكيك الأس عندما يكون المجهول فيه.',
'الخطأ الأشهر: الاستمرار في ضرب أو قسمة {{e}} بدلًا من أخذ {{ln}} للطرفين عندما يكون المجهول في الأس.'],
ideas:[
{id:'i71',title:'الدالة e^x والعلاقة ln e^x = x',tool:'expsolve',toolTitle:'حلّال المعادلات الأسية',
idea:[
'تذكّر أن {{ln y = x}} تعني {{y = e^(x)}}. فإذا عوّضنا {{y = e^(x)}} نحصل على القاعدة الأهم: {{ln e^(x) = x}}.',
'لأن {{e}} عدد ثابت، فإن {{e^(x)}} تتغير قيمتها بتغيّر {{x}}؛ لذلك نسميها {{دالة أسية}} في {{x}}.',
'الدوال الأسية مهمة جدًا في الوقاية من الإشعاع لأنها تصف الظواهر الطبيعية كالاضمحلال الإشعاعي، وتُستخدم في اشتقاق معادلات الاضمحلال وعمر النصف.',
'لتحويل {{e^(x)}} إلى عدد عادي نستخدم {{ln^(−1)}}، ولتخلّص المجهول من الأس نأخذ {{ln}} للطرفين.'],
rules:[
'{{ln e^(x) = x}} و{{e^(ln y) = y}}.',
'{{ln e = 1}} و{{e^(0) = 1}} و{{e^(1) = 2.718}}.',
'{{e^(−x) = 1/e^(x)}} فهي موجبة دائمًا ولا تصبح سالبة.'],
solved:[
{src:'★ مثال من إعداد المكتب',short:'ln e^3 و e^(ln 5)',q:'احسب {{ln e^(3)}} و{{e^(ln 5)}}.',steps:['{{ln e^(3) = 3}} (القاعدة مباشرة).','{{e^(ln 5) = 5}} لأن {{ln}} و{{e^(x)}} عمليتان متعاكستان.'],ans:'{{3}} و{{5}}',id:'s-71-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 7',short:'برهان b = e^(xt)',q:'أثبت أن {{b = e^(xt)}} تعني نفس {{ln b = xt}}.',steps:['نأخذ {{ln}} للطرفين: {{ln b = ln e^(xt)}}.','بقاعدة اللوغاريتم {{log_(b)(m^(n)) = n log_(b) m}} نجد {{ln e^(xt) = xt × ln e}}.','وبما أن {{ln e = 1}} فإن {{ln b = xt}}.'],ans:'{{ln b = xt}}',id:'s-71-2'},
{src:'★ مثال من إعداد المكتب',short:'من e^x إلى x',q:'إذا كان {{e^(x) = 7.389}} فما قيمة {{x}}؟',steps:['نأخذ {{ln}} للطرفين: {{x = ln 7.389}}.','الآلة: {{ln 7.389 = 2.000}}.'],ans:'{{x = 2}}',id:'s-71-3'}],
practice:[
{id:'p-71-1',q:'{{ln e^(−4)}} يساوي:',o:['{{4}}','{{−4}}','{{1/4}}','{{e^(−4)}}'],a:1,s:['{{ln e^(x) = x}} مع {{x = −4}}.']},
{id:'p-71-2',q:'{{e^(ln 12)}} يساوي:',o:['{{12}}','{{ln 12}}','{{e^(12)}}','{{1}}'],a:0,s:['{{e^(ln y) = y}}.']},
{id:'p-71-3',q:'أيّ العبارات تعادل {{a = e^(x)}}؟',o:['{{x = ln a}}','{{x = e^(a)}}','{{x = a/e}}','{{x = log a}}'],a:0,s:['نأخذ {{ln}} للطرفين: {{ln a = x}}.']}
]},
{id:'i72',title:'حساب قيم e^x (بالآلة وبالجداول)',
idea:[
'على الآلة: اضغط {{shift}} ثم {{ln}} (أو الزر {{e^(x)}}). مثال: {{e^(1) = 2.718}} و{{e^(3.5) = 33.115}} و{{e^(−2) = 0.1353}}.',
'بالجداول: {{e^(x)}} = مقابل اللوغاريتم الطبيعي لـ {{x}}. إذا كان {{x}} بين {{0}} و{{2.3026}} فاقرأ مباشرة من الجدول (ابحث عن {{x}} داخل الجدول لا في العمود الجانبي).',
'إذا كان {{x}} أكبر من {{2.3026}}: اطرح من {{x}} أكبر مضاعف مناسب لـ {{ln 10 = 2.3026}} (أي {{ln 10^(k)}}) بحيث يبقى الباقي موجبًا، ثم اكتب {{e^(x) = e^(rest) × 10^(k)}}.',
'إذا كان {{x}} سالبًا: أضف {{2.3026 = ln 10}} (مرّة أو أكثر) حتى يصير الناتج داخل مجال الجدول، ثم عوّض: {{e^(−0.6) = 5.489 × 10^(−1)}}.'],
rules:[
'قراءة مباشرة للمجال {{0 ≤ x ≤ 2.3026}}.',
'{{e^(8.2341) = e^(6.9078 + 1.3263) = 10^(3) × e^(1.3263) = 3.768 × 10^(3)}} (لأن {{ln 10^(3) = 6.9078}}).',
'{{e^(−0.6) = e^(1.7026 − 2.3026) = 5.489 × 10^(−1)}} (لأن {{e^(1.7026) ≈ 5.489}} و{{e^(−2.3026) = 10^(−1)}}).',
'تحقّق بالآلة دائمًا إن كانت متوفرة.'],
solved:[
{src:'من المادة التدريبية — 7.2',short:'e^1 و e^3.5 و e^(-2)',q:'احسب بالآلة: {{e^(1)}} و{{e^(3.5)}} و{{e^(−2)}}.',steps:['{{e^(1) = 2.718}}','{{e^(3.5) = 33.115}}','{{e^(−2) = 1/e^(2) = 1/7.389 = 0.1353}}'],ans:'{{2.718 ، 33.115 ، 0.1353}}',id:'s-72-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 7',short:'e^1.335 و e^10.3562 و e^(-5.5)',q:'احسب بالآلة: {{e^(1.335)}} و{{e^(10.3562)}} و{{e^(−5.5)}}.',steps:['{{e^(1.335) = 3.800}}','{{e^(10.3562) = 3.145 × 10^(4)}} (أي حوالي {{31 451}}).','{{e^(−5.5) = 4.087 × 10^(−3)}} (أي {{0.004087}}).'],ans:'{{3.800}} و{{3.145 × 10^(4)}} و{{4.087 × 10^(−3)}}',id:'s-72-2'},
{src:'من المادة التدريبية — الملحق B مثال 4',short:'e^8.2341 بالجداول',q:'أوجد {{e^(8.2341)}} باستخدام جداول اللوغاريتم الطبيعي.',steps:['{{8.2341}} أكبر من {{2.3026}}؛ نطرح {{6.9078 = ln 10^(3)}}.','{{8.2341 − 6.9078 = 1.3263}}.','{{e^(1.3263) = 3.768}} (من الجدول).','{{e^(8.2341) = 3.768 × 10^(3)}}.'],ans:'{{3.768 × 10^(3)}} (القيمة الدقيقة بالآلة {{3767}})',id:'s-72-3'}],
tool:'lnt',toolTitle:'ln و e^x بطريقة الجداول (للأعداد الكبيرة والصغيرة والسالبة)',
practice:[

]},
{id:'i73',title:'حلّ المعادلات التي فيها ln و e^x',
idea:[
'نستخدم قاعدة الميزان وقواعد اللوغاريتم معًا. إذا كان المجهول في الأس نأخذ {{ln}} للطرفين: من {{a = e^(x)}} نجد {{ln a = x}}.',
'خطوات حلّ {{N = N_(0) e^(−λt)}} لإيجاد {{t}}: اقسم على {{N_(0)}} فيصبح {{N/N_(0) = e^(−λt)}}، ثم خذ {{ln}} للطرفين: {{ln(N/N_(0)) = −λt}}، فإذن {{t = −ln(N/N_(0))/λ}}.',
'عندما تبقى النسبة {{1/2}} نحصل على عمر النصف: {{T_(1/2) = ln 2/λ = 0.693/λ}}.',
'احرص على أن {{ln}} لعدد أصغر من 1 يعطي قيمة سالبة، فيصبح الزمن موجبًا بعد ضربه في {{−1}}.'],
rules:[
'{{a = e^(x)}} ⇔ {{ln a = x}}.',
'{{b = e^(xt)}} ⇔ {{ln b = xt}}.',
'{{ln(1/2) = −ln 2 = −0.693}}.',
'تحقّق من الجواب بالتعويض في المعادلة الأصلية.'],
solved:[
{src:'★ مثال من إعداد المكتب',short:'e^x = 20',q:'أوجد {{x}} إذا كان {{e^(x) = 20}}.',steps:['نأخذ {{ln}} للطرفين: {{x = ln 20}}.','{{ln 20 = 2.9957}}.','التحقق: {{e^(2.9957) = 20.0}} ✓.'],ans:'{{x = 2.996}}',id:'s-73-1'},
{src:'★ مثال من إعداد المكتب',short:'اضمحلال إلى 40%',q:'يتناقص مصدر وفق {{N = N_(0) e^(−0.1t)}} ({{t}} بالأيام). بعد كم يومًا تصبح الفعالية {{40%}} من الأصلية؟',steps:['{{N/N_(0) = 0.4 = e^(−0.1t)}}.','نأخذ {{ln}}: {{ln 0.4 = −0.1t}}.','{{ln 0.4 = −0.9163}} إذن {{t = 0.9163/0.1 = 9.16}}.'],ans:'{{t = 9.16}} يومًا',id:'s-73-2'},
{src:'★ مثال من إعداد المكتب',short:'عمر النصف',q:'بالمعادلة السابقة ({{λ = 0.1}} لكل يوم) أوجد عمر النصف.',steps:['{{N/N_(0) = 0.5}} إذن {{e^(−0.1t) = 0.5}}.','{{−0.1t = ln 0.5 = −0.693}}.','{{t = 6.93}} يومًا. (أو مباشرة {{T_(1/2) = 0.693/λ}}).'],ans:'{{6.93}} يومًا',id:'s-73-3'}],
tool:'expsolve',toolTitle:'حلّال المعادلات الأسية',

/* ============ الفصل 8: المخططات البيانية ============ */
{id:'c8',no:8,title:'المخططات البيانية (Graphs)',sub:'الرسم والقراءة: المحاور، المقاييس الخطية واللوغاريتمية، الاستيفاء، المساحة تحت المنحنى.',
committee:[
'في الإشعاع تُرسم العدّات مقابل الزمن، والجرعة مقابل الزمن، وطيف غاما؛ فالمخطط يحوّل الأرقام إلى صورة مفهومة.',
'ستتعلم أن البيانات الأسية تظهر {{مستقيمة}} على ورق لوغاريتمي/خطي، وأن هذا هو الأساس لاستخراج عمر النصف.',
'الخطأ الأشهر: قراءة المقياس اللوغاريتمي كأنه خطي، ومحاولة وضع الصفر على محور لوغاريتمي (غير ممكن).'],
ideas:[
{id:'i81',title:'المحاور والمقاييس (خطي ولوغاريتمي)',
idea:[
'يحتوي أي مخطط على محورين: الأفقي {{x}} (يُسمّى السيني) والعمودي {{y}} (الصادي). تُرقَّم المحاوير بمقياس مناسب وتُرسم النقاط. النقطة {{(3, 6)}} تعني {{x = 3}} و{{y = 6}}.',
'عادةً نضع المتغير الذي نتحكم به (كالزمن) على المحور السيني، والمتغير الذي نقيسه (كمعدل العدّ) على الصادي.',
'في {{المقياس الخطي}} تتساوى المسافات لمجالات الأعداد المتساوية، وليس شرطًا أن يظهر الصفر. أما في {{المقياس اللوغاريتمي}} فتتساوى المسافات لـ {{× 10}}: {{1 → 10 → 100 → 1000}}. كل قسم كبير يسمى {{دورة (cycle)}}.',
'لا يوجد صفر على المقياس اللوغاريتمي لأن {{log 0}} غير معرّف. وكل دورة تبدأ من {{1}} وتنتهي عند {{10}} (ثم {{10 → 100}} ...).'],
rules:[
'مخطط {{لوغاريتمي/خطي}}: أحد المحورين لوغاريتمي (عادةً y) والآخر خطي.',
'مخطط {{لوغاريتمي/لوغاريتمي}}: كلا المحورين لوغاريتمي.',
'عدد الدورات = عدد قوى العشرة التي تغطيها البيانات (من {{1.8}} إلى {{310}} يحتاج 3 دورات).',
'على الدورة {{1 → 10}} يقع العدد {{5}} على مسافة {{log 5 = 0.699}} من أولها (أبعد من المنتصف).'],
solved:[
{src:'من المادة التدريبية — مثال 1 (8.2.2)',short:'كم دورة نحتاج',q:'بيانات {{y}} تمتد من {{1.8}} إلى {{310}}. كم دورة لوغاريتمية يحتاجها الورق؟',steps:['الدورة الأولى {{1 → 10}} تحتوي {{1.8}}.','الثانية {{10 → 100}} والثالثة {{100 → 1000}} تحتوي {{310}}.','إذن {{3}} دورات.'],ans:'{{3}} دورات',id:'s-81-1'},
{src:'★ مثال من إعداد المكتب',short:'موقع 5 على المقياس',q:'ضمن دورة تمتد من {{1}} إلى {{10}} بطول {{10 cm}}، على أي بعد من بدايتها يقع العدد {{5}} ؟ وماذا عن {{2}} ؟',steps:['المسافة = {{log(العدد) × طول الدورة}}.','{{5}}: {{0.699 × 10 = 6.99 cm}}.','{{2}}: {{0.301 × 10 = 3.01 cm}}.'],ans:'{{6.99 cm}} و{{3.01 cm}}',id:'s-81-2'},
{src:'★ مثال من إعداد المكتب',short:'نقطة على مخطط خطي',q:'ارسم النقاط {{(1, 2)}} و{{(2, 4)}} و{{(3, 6)}}. ما العلاقة بين {{y}} و{{x}} ؟',steps:['في كل نقطة {{y = 2x}}.','النقاط تقع على خط مستقيم يمرّ بالأصل.'],ans:'{{y = 2x}}',id:'s-81-3'}],
tool:'plot',toolTitle:'ارسم بياناتك: خطي، لوغاريتمي/خطي، لوغاريتمي/لوغاريتمي',
practice:[
{id:'p-81-1',q:'كم دورة يحتاجها محور لوغاريتمي لتغطية البيانات من {{5}} إلى {{50 000}} ؟',o:['{{3}}','{{4}}','{{5}}','{{10}}'],a:2,s:['{{5}} تقع في الدورة {{1 → 10}}.','{{50 000}} تقع في الدورة {{10^(4) → 10^(5)}} وهي الدورة الخامسة.','إذن 5 دورات.']},
{id:'p-81-2',q:'أيّ العدد لا يمكن رسمه على محور لوغاريتمي؟',o:['{{0}}','{{0.01}}','{{1}}','{{10 000}}'],a:0,s:['{{log 0}} غير معرّف.','أما {{0.01}} فمرسومة في دورة {{0.01 → 0.1}}.']},
{id:'p-81-3',q:'على محور لوغاريتمي، أين يقع العدد {{3.16}} تقريبًا ضمن الدورة {{1 → 10}} ؟',o:['عند الربع','عند المنتصف','عند الثلاثة أرباع','في آخر الدورة'],a:1,s:['{{log 3.16 = 0.5}}.','فهو في منتصف الدورة تمامًا (وليس 5.5 كما يظن البعض).']}
]},
{id:'i82',title:'الاستيفاء الداخلي والخارجي وخط الموائمة',tool:'plot',toolTitle:'جرّب الاستيفاء وخط الموائمة',
idea:[
'{{الاستيفاء الداخلي (Interpolation)}}: قراءة قيمة من المخطط {{بين}} نقاط البيانات المقيسة، بخط عمودي من {{x}} إلى المنحنى ثم أفقي إلى محور {{y}}.',
'{{الاستيفاء الخارجي (Extrapolation)}}: قراءة قيمة {{خارج}} مدى البيانات بمدّ الخط. مفيد لكنه أقل موثوقية.',
'{{خط الموائمة الأفضل}}: خط أو منحنى لا يمرّ بالضرورة بكل نقطة، بل تتوزّع النقاط على جانبيه بالتساوي ويمرّ من {{أعمدة الخطأ}} كلها. تتطلّب البيانات التجريبية دائمًا خط موائمة لأن كل قياس يحمل خطأً.',
'أعمدة الخطأ ({{error bars}}) تُظهر دقّة كل نقطة، وسنتعلّم حسابها في الفصل التاسع.'],
rules:[
'{{داخل}} المدى = استيفاء داخلي (موثوق أكثر).',
'{{خارج}} المدى = استيفاء خارجي (احذر: قد لا تستمر العلاقة بنفس الصورة).',
'اجعل نصف النقاط فوق الخط ونصفها تحته، ودعه يمرّ عبر أعمدة الخطأ.',
'للبيانات الأسية استخدم ورقًا لوغاريتميًا/خطيًا لأن الخط يصبح مستقيمًا فيسهل رسمه.'],
solved:[
{src:'من المادة التدريبية — 8.2.1',short:'عدد المصادر والنشاط',q:'جدول: عدد المصادر {{1 ، 2 ، 3 ، 4 ، 5 ، 6}} ونشاطها {{2 ، 4 ، 6 ، 8 ، 10 ، 12}}. أوجد نشاط {{1.7}} مصدر، ونشاط {{8}} مصادر.',steps:['العلاقة {{النشاط = 2 × العدد}} (خطية).','{{1.7}}: بين 1 و2 (داخل المدى) إذن استيفاء داخلي: {{2 × 1.7 = 3.4}} (الكتاب يقرأ ≈ 3.5 من الرسم).','{{8}}: خارج المدى (أكبر من 6) إذن استيفاء خارجي: {{2 × 8 = 16}}.'],ans:'{{3.4}} و{{16}}',id:'s-82-1'},
{src:'من المادة التدريبية — مثال 1 (8.2.2)',short:'قيمة y عند x = 7',q:'البيانات: {{x = 1 ، 2 ، 4 ، 6 ، 8 ، 10}} و{{y = 1.8 ، 3.3 ، 10.4 ، 33 ، 102 ، 310}}. أوجد {{y}} عند {{x = 7}} بالاستيفاء على ورق لوغاريتمي/خطي.',steps:['نرسم {{log y}} مقابل {{x}}؛ النقاط تقع قرب خط مستقيم.','نقرأ عند {{x = 7}}: بين {{x = 6}} ({{y = 33}}) و{{x = 8}} ({{y = 102}}).','نستوفي على المقياس اللوغاريتمي: {{log y ≈ (1.519 + 2.009)/2 = 1.764}} إذن {{y ≈ 58}}.','الكتاب يقرأ من الرسم ≈ {{56}}؛ والفرق صغير نتيجة القراءة اليدوية.'],ans:'{{y ≈ 56 إلى 58}}',id:'s-82-2'},
{src:'★ مثال من إعداد المكتب',short:'استيفاء خطي بين نقطتين',q:'قيس معدل العدّ: عند {{t = 2 min}} كان {{10}} وعند {{t = 6 min}} كان {{30}}. قدّر المعدل عند {{t = 5 min}} بافتراض أن العلاقة خطية بين النقطتين.',steps:['الميل {{= (30 − 10)/(6 − 2) = 5}} لكل دقيقة.','من {{t = 2}} إلى {{t = 5}}: {{3 × 5 = 15}}.','{{10 + 15 = 25}}.'],ans:'{{25}}',id:'s-82-3'}],
practice:[
{id:'p-82-1',q:'قراءة قيمة من المخطط عند {{x}} خارج مدى البيانات تسمى:',o:['استيفاء داخلي','استيفاء خارجي','تكامل','تدوير'],a:1,s:['خارج المدى = استيفاء خارجي (استقراء).']},
{id:'p-82-2',q:'في خط الموائمة الأفضل، ما الصحيح؟',o:['يمرّ بكل نقطة بالضبط','يمرّ بأعمدة الخطأ والنقاط موزعة على جانبيه','يبدأ دائمًا من الصفر','يكون دائمًا أفقيًا'],a:1,s:['الخط يمثّل الاتجاه العام لا القياسات الفردية.']},
{id:'p-82-3',q:'النقاط {{(2, 10)}} و{{(6, 30)}} على مخطط خطي. القيمة المستوفاة عند {{x = 4}} هي:',o:['{{15}}','{{20}}','{{25}}','{{18}}'],a:1,s:['{{x = 4}} في منتصف المسافة بين 2 و6.','{{(10 + 30)/2 = 20}}.']}
]},
{id:'i83',title:'المساحة تحت المنحنى',
idea:[
'المساحة بين المنحنى والمحور السيني مهمة في الإشعاع. تُحسب بدقّة بعملية رياضية تدعى {{التكامل}} (خارج هذا المقرر)، ويمكن تقديرها بعدّ المربعات على الورقة البيانية.',
'مثال 1: مخطط {{العدّات مقابل طاقة الإشعاع}} (طيف غاما): المساحة تحت المنحني تعطي {{العدّات الكلية}} للعينة.',
'مثال 2: مخطط {{معدل الجرعة مقابل الزمن}}: المساحة تحت المنحني تعطي {{الجرعة الكلية}}.',
'طريقة العدّ: إذا كان كل مربع صغير يمثّل {{a × b}} (من وحدات المحورين) فالمساحة = {{عدد المربعات × a × b}}.'],
rules:[
'مساحة المستطيل = العرض × الارتفاع (مثلًا معدل جرعة ثابت × زمن = جرعة).',
'قاعدة شبه المنحرف: بين نقطتين {{(x_(1), y_(1))}} و{{(x_(2), y_(2))}} المساحة = {{(x_(2) − x_(1)) × (y_(1) + y_(2))/2}}.',
'المساحة الكلية = مجموع مساحات الأجزاء.'],
solved:[
{src:'★ مثال من إعداد المكتب',short:'جرعة من معدل ثابت',q:'معدل جرعة ثابت {{3 mSv/y}} لمدة {{4}} سنوات. ما الجرعة الكلية بحساب المساحة؟',steps:['الشكل مستطيل: العرض {{4}} سنوات والارتفاع {{3}}.','المساحة {{4 × 3 = 12}}.'],ans:'{{12 mSv}}',id:'s-83-1'},
{src:'★ مثال من إعداد المكتب',short:'شبه المنحرف',q:'منحنى يمرّ بالنقاط {{(0, 0)}} و{{(2, 4)}} و{{(4, 4)}} و{{(6, 0)}}. احسب المساحة تحته بقاعدة شبه المنحرف.',steps:['{{0 → 2}}: {{2 × (0 + 4)/2 = 4}}.','{{2 → 4}}: {{2 × (4 + 4)/2 = 8}}.','{{4 → 6}}: {{2 × (4 + 0)/2 = 4}}.','المجموع {{4 + 8 + 4 = 16}}.'],ans:'{{16}}',id:'s-83-2'},
{src:'★ مثال من إعداد المكتب',short:'عدّ المربعات',q:'مخطط معدل الجرعة مقابل الزمن، كل مربع يمثّل {{2 years}} على المحور السيني و{{5 mSv/y}} على الصادي. المنحنى يغطي {{7}} مربعات. ما الجرعة الكلية؟',steps:['كل مربع = {{2 × 5 = 10 mSv}}.','{{7 × 10 = 70}}.'],ans:'{{70 mSv}}',id:'s-83-3'}],
tool:'area',toolTitle:'حاسبة المساحة تحت المنحنى (شبه المنحرف)',
practice:[
{id:'p-83-1',q:'المساحة تحت مخطط معدل الجرعة مقابل الزمن تعطي:',o:['العدّات الكلية','الجرعة الكلية','عمر النصف','الانحراف المعياري'],a:1,s:['{{معدل الجرعة × الزمن = الجرعة}}.']},
{id:'p-83-2',q:'المساحة تحت المستقيم من {{(0, 2)}} إلى {{(4, 6)}} (شبه المنحرف) تساوي:',o:['{{16}}','{{12}}','{{24}}','{{8}}'],a:0,s:['{{4 × (2 + 6)/2 = 16}}.']},
{id:'p-83-3',q:'مخطط طيف غاما: المساحة تحت القمة تعطي:',o:['الجرعة','العدّات الكلية للقمة','الزمن','الطاقة فقط'],a:1,s:['العدّات مقابل الطاقة: المساحة = مجموع العدّات.']}
]},
{id:'i84',title:'الارتباطات الخطية والأسية واللوغاريتمية/اللوغاريتمية',tool:'plot',toolTitle:'اختر الورق المناسب لبياناتك',
idea:[
'{{علاقة خطية}} {{y = ax + b}}: تظهر مستقيمًا على ورق خطي/خطي.',
'{{علاقة أسية}} {{y = a e^(bx)}}: على الورق الخطي تظهر منحنى. ولكن إذا أخذنا {{ln}} نجد {{ln y = ln a + bx}} وهي معادلة خط مستقيم؛ لذلك تظهر مستقيمة على ورق {{لوغاريتمي/خطي}}.',
'{{علاقة قوّة}} {{y = a x^(n)}}: نأخذ {{log}} فنجد {{log y = log a + n log x}} فتظهر مستقيمة على ورق {{لوغاريتمي/لوغاريتمي}} وميلها هو {{n}}.',
'المقياس اللوغاريتمي يسمح برسم الأعداد الصغيرة والكبيرة بالدقّة نفسها، مثل مخطط نشاط الوقود بعد إغلاق المفاعل (المحوران لوغاريتميان: من 1 إلى 1000 يوم، ومن 1000 إلى 100000 TBq/MW).'],
rules:[
'خطي ⇒ مستقيم على خطي/خطي.',
'أسّي ⇒ مستقيم على لوغاريتمي/خطي.',
'قوّة ⇒ مستقيم على لوغاريتمي/لوغاريتمي.',
'لقراءة قيمة على المقياس اللوغاريتمي اقرأ المحور كما هو (لا تعتبره خطيًا).'],
solved:[
{src:'★ مثال من إعداد المكتب',short:'أيّ ورق نستخدم؟',q:'حدّد الورق الذي يجعل كلًا من العلاقتين مستقيمًا: (أ) {{y = 3x + 1}} (ب) {{y = 2e^(0.5x)}} (ج) {{y = x^(2)}}.',steps:['(أ) خطية: ورق خطي/خطي.','(ب) أسية: {{ln y = ln 2 + 0.5x}} فورق لوغاريتمي/خطي.','(ج) قوّة: {{log y = 2 log x}} فورق لوغاريتمي/لوغاريتمي وميله 2.'],ans:'خطي، لوغ/خطي، لوغ/لوغ',id:'s-84-1'},
{src:'من المادة التدريبية — الشكل 14',short:'نشاط الوقود بعد الإغلاق',q:'على مخطط لوغاريتمي/لوغاريتمي لنشاط الوقود (TBq/MW) بعد إغلاق مفاعل: قراءة {{10}} أيام ≈ {{2 × 10^(4)}} و{{120}} يومًا ≈ {{7 × 10^(3)}}. ماذا نقرأ؟',steps:['نتتبع الخط العمودي من {{10 days}} إلى المنحنى ثم أفقيًا إلى المحور الصادي.','نقرأ {{≈ 2 × 10^(4) TBq/MW}} (أي {{20 000}}).','عند {{120 days}} نقرأ {{≈ 7 × 10^(3)}} (أي {{7000}}).'],ans:'{{20 000}} و{{7 000}} TBq/MW',id:'s-84-2'},
{src:'★ مثال من إعداد المكتب',short:'ميل على لوغ/لوغ',q:'نقطتان على مستقيم في مخطط لوغ/لوغ: {{(2, 4)}} و{{(20, 400)}}. أوجد ميل المستقيم {{n}} وصيغة العلاقة.',steps:['{{n = (log 400 − log 4)/(log 20 − log 2)}}','{{= (2.602 − 0.602)/(1.301 − 0.301) = 2/1 = 2}}.','العلاقة {{y = a x^(2)}} وبالتعويض {{4 = a × 4}} فـ {{a = 1}}: {{y = x^(2)}}.'],ans:'{{n = 2}} و{{y = x^(2)}}',id:'s-84-3'}],
practice:[
{id:'p-84-1',q:'البيانات الأسية تظهر مستقيمة على ورق:',o:['خطي/خطي','لوغاريتمي/خطي','لوغاريتمي/لوغاريتمي','لا يوجد ورق مناسب'],a:1,s:['{{ln y = ln a + bx}} علاقة خطية بين {{ln y}} و{{x}}.']},
{id:'p-84-2',q:'علاقة {{y = 5x^(3)}} تظهر مستقيمة وميلها {{3}} على ورق:',o:['لوغاريتمي/خطي','خطي/خطي','لوغاريتمي/لوغاريتمي','خطي/لوغاريتمي'],a:2,s:['{{log y = log 5 + 3 log x}}.','الميل 3 عندما يكون المحوران لوغاريتميين.']},
{id:'p-84-3',q:'ما فائدة المقياس اللوغاريتمي؟',o:['يظهر الصفر بوضوح','يرسم الأعداد الصغيرة والكبيرة بنفس الدقة','يجعل كل العلاقات خطية','يلغي أعمدة الخطأ'],a:1,s:['كل دورة تغطي ضعف 10 أضعاف؛ فتتجاور القيم الصغيرة والكبيرة.']}
]}
]},
/* ============ الفصل 9: الاحتمال وإحصاء العدّ ============ */
{id:'c9',no:9,title:'الاحتمال البسيط وإحصاء العدّ',sub:'لماذا تختلف العدّات؟ الانحراف المعياري، مستويات الثقة، الخطأ المعياري وأعمدة الخطأ.',
committee:[
'كل قياس إشعاعي فيه {{عشوائية}}: عينة واحدة تعطي عدّات مختلفة في كل مرة، وهذا لا علاقة له بعطل الجهاز بل بطبيعة الاضمحلال.',
'ستتعلم تقدير هذا الاختلاف: {{σ = √n}} لقياس واحد، و{{σ = √(R/t)}} لمعدل العدّ، وتصحيح الخلفية الطبيعية، وإيجاد الخطأ لسلسلة قياسات.',
'الخطأ الأشهر: الخلط بين {{الانحراف المعياري للعدّ}} (جذر العدد) وبين {{الانحراف المعياري لسلسلة القياسات}} (Ω).'],
ideas:[
{id:'i91',title:'الاحتمال والتوزيع الطبيعي للعدّات',
idea:[
'{{الاحتمال}} عدد بين {{0}} و{{1}} يحدّد فرصة حدوث حدث: {{الحوادث المرغوبة ÷ كل النتائج الممكنة}}. احتمال ظهور وجه معيّن لعملة هو {{1/2 = 0.5 = 50%}}. القيمة {{1}} تعني حدثًا مؤكدًا، و{{0}} حدثًا مستحيلًا.',
'إذا رميت عملة {{100}} مرة في عشر مجموعات فلن تحصل على {{50}} وجهًا في كل مجموعة؛ مثلًا {{47 ، 56 ، 49 ، 54 ، 53 ، 54 ، 48 ، 47 ، 51 ، 46}}. هذا الاختلاف ناتج عن طبيعة الصدفة، لا عن عيب في العملة. كلما زاد عدد المجموعات اقترب المتوسط من {{50}}.',
'كذلك عدّ عينة مشعّة {{240}} مرة يعطي أرقامًا مختلفة؛ ورسم تكرار كل نتيجة يعطي {{منحنى غوص (Gauss)}} أو {{التوزيع الطبيعي}} على شكل جرس: أعلى نقطة هي العدّ الأكثر احتمالًا وعرضه يقيس خطأ العدّ.',
'{{المتوسط}} {{n̄ = Σn/N}}: نجمع كل العدّات ونقسم على عدد القياسات. في الجدول (240 قياسًا) يساوي {{22 237 / 240 = 92.65 ≈ 93}}.'],
rules:[
'{{الاحتمال = الحالات المرغوبة / الحالات الممكنة}}.',
'المتوسط = {{مجموع القيم ÷ عددها}}.',
'في التوزيع الطبيعي الحقيقي: المتوسط = القيمة الأكثر احتمالًا.',
'العدّات ≥ 30 تقريبًا تكفي لاعتبار التوزيع طبيعيًا (غوص).'],
solved:[
{src:'★ مثال من إعداد المكتب',short:'احتمال على نرد',q:'نرد عادي سداسي الأوجه. ما احتمال: (أ) ظهور العدد {{5}} (ب) ظهور عدد زوجي (ج) ظهور عدد أصغر من {{7}} ؟',steps:['(أ) حالة واحدة من 6: {{1/6 ≈ 0.167}}.','(ب) الأعداد الزوجية {{2 ، 4 ، 6}}: {{3/6 = 0.5}}.','(ج) كل الأعداد {{1 … 6}} أصغر من 7: {{6/6 = 1}} (حدث مؤكد).'],ans:'{{1/6}} و{{0.5}} و{{1}}',id:'s-91-1'},
{src:'من المادة التدريبية — 9.2',short:'متوسط جدول العدّات',q:'جدول تردّد ({{عدّة : عدد المرات}}): {{52:3 ، 60:10 ، 73:21 ، 78:30 ، 82:39 ، 92:41 ، 98:38 ، 108:28 ، 121:20 ، 147:10}}. احسب المتوسط.',steps:['{{Σn = 52×3 + 60×10 + 73×21 + 78×30 + 82×39 + 92×41 + 98×38 + 108×28 + 121×20 + 147×10 = 22 237}}.','{{N = 3+10+21+30+39+41+38+28+20+10 = 240}}.','{{n̄ = 22 237 / 240 = 92.65}}.','نقرّب (لأن العدّ لا يكون كسرًا): {{93}}.'],ans:'{{92.65 ≈ 93}}',id:'s-91-2'},
{src:'★ مثال من إعداد المكتب',short:'متوسط خمس قراءات',q:'خمس قراءات لنفس العينة: {{90 ، 95 ، 100 ، 110 ، 105}}. أوجد المتوسط.',steps:['المجموع {{90 + 95 + 100 + 110 + 105 = 500}}.','{{N = 5}}.','{{n̄ = 500/5 = 100}}.'],ans:'{{100}}',id:'s-91-3'}],
tool:'sim',toolTitle:'محاكاة العدّ العشوائي (التوزيع الطبيعي)',
practice:[
{id:'p-91-1',q:'كيس فيه {{3}} كرات حمراء و{{7}} زرقاء. احتمال سحب كرة حمراء:',o:['{{0.3}}','{{0.7}}','{{3}}','{{0.37}}'],a:0,s:['{{3/10 = 0.3}}.']},
{id:'p-91-2',q:'ما معنى أن احتمال حدث يساوي {{0}} ؟',o:['الحدث مؤكد','الحدث لن يحدث أبدًا','الحدث متساوي الفرص','الحدث صعب جدًا فقط'],a:1,s:['القيمة 0 تعني استحالة الحدوث.']},
{id:'p-91-3',q:'في قياسات كثيرة لعدّ عينة مشعة، ما سبب اختلاف النتائج؟',o:['عطل في العدّاد','الطبيعة العشوائية للاضمحلال','خطأ في التدوير','تغيّر الحرارة'],a:1,s:['الاختلاف إحصائي طبيعي حتى مع جهاز سليم تمامًا.']},
{id:'p-91-4',q:'مجموعة قياسات: {{48 ، 52 ، 50 ، 51 ، 49}}. المتوسط:',o:['{{50}}','{{49}}','{{51}}','{{250}}'],a:0,s:['المجموع {{250}} و{{N = 5}}.','{{250/5 = 50}}.']}
]},
{id:'i92',title:'الانحراف المعياري لقياس واحد وتصحيح الخلفية',
idea:[
'{{الانحراف المعياري σ}} يقيس عرض منحنى التوزيع. إذا قست العدّات {{n_(sc)}} مرة واحدة فقط فإن الانحراف المعياري يساوي {{الجذر التربيعي}} لهذا العدد: {{σ_(sc) = √n_(sc)}}.',
'مثال: عدّت عينة {{566}} عدّة ⇒ {{σ = √566 = 24}} (برقمين معنويين).',
'{{مستوى الثقة}}: مجال {{± 1σ}} يغطي {{68%}} من القياسات، و{{± 2σ}} يغطي {{95%}}، و{{± 3σ}} يغطي {{99.7%}}. الجدول: {{50% ← 0.7σ ، 68% ← 1.0σ ، 90% ← 1.6σ ، 95% ← 2.0σ}}.',
'عند وجود {{الخلفية الطبيعية (background)}} {{n_(b)}} نحسب الانحراف الصافي {{σ_(net) = √(n_(sc) + n_(b))}}. وإذا كانت عدّات الخلفية أقل بكثير من عدّات العينة نهمل إسهامها.'],
rules:[
'{{σ = √n}} لقياس عدّ واحد.',
'{{σ_(net) = √(n_(sc) + n_(b))}} مع الخلفية.',
'النتيجة المعلنة: {{n ± σ}} (68%) أو {{n ± 2σ}} (95%).',
'مستويات الثقة: {{50% = 0.7σ ، 68% = 1σ ، 90% = 1.6σ ، 95% = 2σ}}.'],
solved:[
{src:'من المادة التدريبية — مثال 1 (9.3.1)',short:'566 عدّة',q:'عدّ مصدر مشعّ فكان {{566}} عدّة. ما الانحراف المعياري؟ واكتب النتيجة عند مستويي ثقة {{68%}} و{{95%}}.',steps:['{{σ = √566 = 23.8 ≈ 24}} (برقمين معنويين).','عند {{68%}} (1σ): {{566 ± 24}}.','عند {{95%}} (2σ): {{566 ± 48}}.'],ans:'{{σ = 24}} و{{566 ± 48}} عند 95%',id:'s-92-1'},
{src:'من المادة التدريبية — مثال 2 (9.3.2)',short:'566 مع خلفية 20',q:'عُدّت عينة فكانت {{566}} عدّة، والخلفية {{20}} عدّة. ما الانحراف المعياري الصافي؟',steps:['{{σ_(net) = √(566 + 20) = √586}}.','{{√586 = 24.2 ≈ 24}}.','يساوي نفس قيمة المثال السابق لأن الخلفية صغيرة جدًا.'],ans:'{{24}}',id:'s-92-2'},
{src:'من المادة التدريبية — الاختبار الذاتي 9',short:'64 عدّة بمستويين',q:'قياس واحد أعطى {{64}} عدّة. اكتب النتيجة عند: (أ) مستوى ثقة {{95%}} (ب) مستوى ثقة {{90%}}.',steps:['{{σ = √64 = 8}}.','(أ) {{95% = 2σ = 16}} فالنتيجة {{64 ± 16}}.','(ب) {{90% = 1.6σ = 12.8 ≈ 13}} فالنتيجة {{64 ± 13}}.'],ans:'{{64 ± 16}} و{{64 ± 13}}',id:'s-92-3'}],
tool:'stats',toolTitle:'حاسبة الانحراف المعياري للعدّ',
practice:[
{id:'p-92-1',q:'عدّ مصدر {{2500}} عدّة. الانحراف المعياري:',o:['{{50}}','{{25}}','{{250}}','{{12.5}}'],a:0,s:['{{σ = √2500 = 50}}.']},
{id:'p-92-2',q:'ما نسبة القياسات المتوقعة ضمن المجال {{± 1σ}} ؟',o:['{{50%}}','{{68%}}','{{95%}}','{{99.7%}}'],a:1,s:['{{± 1σ}} يغطي {{68.26% ≈ 68%}}.']},
{id:'p-92-3',q:'ما نسبة القياسات المتوقعة ضمن المجال {{± 2σ}} ؟',o:['{{68%}}','{{90%}}','{{95%}}','{{99.7%}}'],a:2,s:['{{± 2σ}} يغطي {{95.46% ≈ 95%}}.']},
{id:'p-92-4',q:'عدّة العينة {{400}} وعدّة الخلفية {{100}}. الانحراف المعياري الصافي تقريبًا:',o:['{{22}}','{{20}}','{{500}}','{{15}}'],a:0,s:['{{σ_(net) = √(400 + 100) = √500}}.','{{√500 = 22.4 ≈ 22}}.']}
]},
{id:'i93',title:'معدّل العدّ والانحراف المعياري مع الزمن',
idea:[
'عند قياس {{معدّل العدّ}} {{R = n/t}} (عدّة في الدقيقة مثلًا) يجب أن نأخذ الزمن بالحسبان: {{σ_(R) = √(R/t)}}.',
'اشتقاق سريع: {{σ_(n) = √n}} و{{R = n/t}} فالخطأ في {{R}} هو {{σ_(n)/t = √n/t = √(R t)/t = √(R/t)}}.',
'مع الخلفية: {{σ_(net) = √(σ_(R)^(2) + σ_(b)^(2)) = √(R_(sc)/t_(sc) + R_(b)/t_(b))}} حيث {{R_(b)}} و{{t_(b)}} معدّل الخلفية وزمن قياسها. وغالبًا تكون الخلفية صغيرة فنهملها.',
'ملاحظة: في الأمثلة، {{7280}} هو {{عدد العدّات الكلي}} و{{1456 cpm}} هو {{المعدّل}}. الأخطاء تُنسب للمعدّل.'],
rules:[
'{{R = n/t}} ثم {{σ_(R) = √(R/t)}}.',
'لتقليل الخطأ إلى النصف يجب مضاعفة زمن القياس أربع مرات.',
'الخلفية: {{σ_(net) = √(R_(sc)/t_(sc) + R_(b)/t_(b))}}.',
'اكتب الجواب مع الوحدة (cpm = counts per minute).'],
solved:[
{src:'من المادة التدريبية — مثال 3 (9.3.3)',short:'7280 عدّة في 5 دقائق',q:'عُدّت عينة مدة {{5}} دقائق فكان العدّ {{7280}}. ما الانحراف المعياري لمعدّل العدّ؟',steps:['{{R = 7280/5 = 1456 cpm}}.','{{σ_(R) = √(R/t) = √(1456/5) = √291.2 = 17.06}}.','نكتب {{R = 1456 ± 17 cpm}} (68%) أو {{1456 ± 34 cpm}} (95%).'],ans:'{{σ = 17 cpm}}',id:'s-93-1'},
{src:'من المادة التدريبية — مثال 4 (9.3.4)',short:'7280 عدّة مع خلفية 32 cpm',q:'للعينة نفسها قيست الخلفية فكانت {{32 cpm}} على مدى {{30}} دقيقة. ما الانحراف المعياري الصافي؟',steps:['{{σ_(R) = √(1456/5) = 17.06 ≈ 17}}.','{{σ_(b) = √(32/30) = √1.067 = 1.03 ≈ 1}}.','{{σ_(net) = √(17.06^(2) + 1.03^(2)) = √(291.2 + 1.07) = 17.1 ≈ 17 cpm}}.','الخلفية لم تغيّر الجواب فيمكن إهمالها.'],ans:'{{17 cpm}}',id:'s-93-2'},
{src:'★ مثال من إعداد المكتب',short:'تقليل الخطأ بالزمن',q:'بالمعدّل {{R = 1456 cpm}}: قارن {{σ_(R)}} عند {{t = 5 min}} و{{t = 20 min}}.',steps:['{{t = 5}}: {{σ = √(1456/5) = 17.06}}.','{{t = 20}}: {{σ = √(1456/20) = √72.8 = 8.53}}.','الزمن ×4 ⇒ الخطأ ÷2.'],ans:'{{17.06 → 8.53}} (النصف)',id:'s-93-3'}],
practice:[
{id:'p-93-1',q:'عُدّت عينة {{4}} دقائق فكان العدّ {{3600}}. الانحراف المعياري لمعدّل العدّ:',o:['{{15 cpm}}','{{30 cpm}}','{{60 cpm}}','{{7.5 cpm}}'],a:0,s:['{{R = 3600/4 = 900 cpm}}.','{{σ = √(900/4) = √225 = 15}}.']},
{id:'p-93-2',q:'عدّ {{100}} عدّة في {{10 s}}. ما النتيجة عند ثقة {{95%}} (عدّة/ثانية)؟',o:['{{10 ± 2}}','{{10 ± 1}}','{{100 ± 20}}','{{10 ± 4}}'],a:0,s:['{{R = 10 cps}} و{{σ = √(10/10) = 1}}.','{{95% = 2σ = 2}} فـ {{10 ± 2}}.']},
{id:'p-93-3',q:'كم نضاعف زمن القياس لنقلّل الانحراف المعياري لمعدّل العدّ إلى النصف؟',o:['مرتين','4 مرات','8 مرات','لا يتأثر'],a:1,s:['{{σ ∝ 1/√t}}.','لجعل {{σ/2}} نحتاج {{√t × 2}} أي {{t × 4}}.']}
]},
{id:'i94',title:'سلسلة قياسات: المتوسط، Ω، الخطأ المعياري وأعمدة الخطأ',
idea:[
'عند أخذ {{عدّة قياسات}} متكرّرة تحت نفس الشروط يكون المتوسط أدقّ. الانحراف المعياري لسلسلة القياسات: {{Ω = √(Σ(n − n̄)^(2)/(N − 1))}}.',
'خطوات الحساب: (1) المتوسط {{n̄}} (2) الفرق {{n − n̄}} لكل قراءة (3) تربيع الفروق (4) جمعها (5) القسمة على {{N − 1}} (6) الجذر التربيعي.',
'{{الخطأ المعياري}} للمتوسط {{E = Ω/√N}} (عند مستوى ثقة {{68%}}). وعند {{95%}} نأخذ {{2E}}.',
'{{أعمدة الخطأ}} على المخطط تُرسم عادةً عند {{95%}} ({{± 2σ}}). مثال: عدّة {{100}} ⇒ {{σ = 10}} ⇒ العمود الكامل {{± 20}} (95%) أو {{± 10}} (68%).'],
rules:[
'{{n̄ = Σn/N}}.',
'{{Ω = √(Σ(n − n̄)^(2)/(N − 1))}}.',
'{{E = Ω/√N}} ← 68%  ،  {{2E}} ← 95%.',
'كلما كبر {{N}} صغر الخطأ المعياري (لكن بجذر {{N}} وليس بـ {{N}}).'],
solved:[
{src:'من المادة التدريبية — مثال 5 (9.3.5)',short:'عشر قراءات',q:'عشر قراءات لنفس العينة: {{10 ، 12 ، 7 ، 10 ، 12 ، 9 ، 10 ، 7 ، 9 ، 10}}. أوجد المتوسط وΩ والخطأ المعياري.',steps:['المتوسط {{n̄ = 96/10 = 9.6}}.','الفروق: {{0.4 ، 2.4 ، −2.6 ، 0.4 ، 2.4 ، −0.6 ، 0.4 ، −2.6 ، −0.6 ، 0.4}} ومربعاتها مجموعها {{26.4}}.','{{Ω = √(26.4/9) = √2.933 = 1.71}}.','{{E = 1.71/√10 = 0.54}} فتكون النتيجة {{9.6 ± 0.5}} (68%) أو {{9.6 ± 1.1}} (95%).'],ans:'{{n̄ = 9.6 ، Ω = 1.7 ، E = 0.54}}',id:'s-94-1'},
{src:'من المادة التدريبية — الاختبار الذاتي 9',short:'متوسط والخطأ عند 95%',q:'القياسات: {{65 ، 68 ، 64 ، 59 ، 68 ، 61 ، 59 ، 64 ، 64 ، 62}}. احسب المتوسط والخطأ عند ثقة {{95%}}.',steps:['{{Σn = 634}} و{{N = 10}} فـ {{n̄ = 63.4}}.','{{Σ(n − n̄)^(2) = 92.4}} و{{Ω = √(92.4/9) = √10.27 = 3.20}}.','{{E = 3.20/√10 = 1.01}}.','{{95%}}: {{2E = 2.0}} فالنتيجة {{63.4 ± 2.0}}.'],ans:'{{63.4 ± 2.0}}',id:'s-94-2'},
{src:'من المادة التدريبية — 9.5',short:'عمود الخطأ لـ 100 عدّة',q:'نقطة على مخطط عدّات قيمتها {{100}}. ما طول عمود الخطأ عند {{95%}} وعند {{68%}}؟',steps:['{{σ = √100 = 10}}.','{{95% = 2σ = ± 20}}.','{{68% = 1σ = ± 10}}.'],ans:'{{± 20}} و{{± 10}}',id:'s-94-3'}],
tool:'series',toolTitle:'حاسبة سلسلة القياسات',
practice:[
{id:'p-94-1',q:'القياسات {{4 ، 6 ، 5 ، 5 ، 5}}. المتوسط والانحراف المعياري Ω تقريبًا:',o:['{{5.0}} و{{0.71}}','{{5.0}} و{{1.00}}','{{4.8}} و{{0.71}}','{{5.0}} و{{0.50}}'],a:0,s:['{{n̄ = 25/5 = 5}}.','الفروق {{−1 ، 1 ، 0 ، 0 ، 0}} ومربعاتها {{1 + 1 = 2}}.','{{Ω = √(2/4) = √0.5 = 0.71}}.']},
{id:'p-94-2',q:'إذا كان {{Ω = 4}} و{{N = 16}} فالخطأ المعياري {{E}} يساوي:',o:['{{1}}','{{0.25}}','{{4}}','{{16}}'],a:0,s:['{{E = Ω/√N = 4/4 = 1}}.']},
{id:'p-94-3',q:'لتقليل الخطأ المعياري إلى النصف، نضاعف عدد القياسات:',o:['مرتين','4 مرات','8 مرات','10 مرات'],a:1,s:['{{E ∝ 1/√N}}.','نحتاج {{√N}} مضروبًا في 2 أي {{N × 4}}.']},
{id:'p-94-4',q:'من المعطيات {{n̄ = 9.6}} و{{E = 0.54}}: النتيجة عند {{95%}} هي:',o:['{{9.6 ± 0.54}}','{{9.6 ± 1.1}}','{{9.6 ± 0.27}}','{{9.6 ± 5.4}}'],a:1,s:['{{95% = 2E = 1.08 ≈ 1.1}}.']}
]}
]}
];

function mkPr(p,n){
  const d=document.createElement('div');d.className='ex';let done=false;

const g=(x,s=4)=>{if(!Number.isFinite(x))return '—';if(x===0)return '0';const a=Math.abs(x);return (a>=1e5||a<1e-3)?sci(x,s):String(+x.toPrecision(s));};
const sci=(x,s=4)=>{if(!Number.isFinite(x)||x===0)return '0';const e=x.toExponential(s-1);const [m,ex]=e.split('e');return m+' × 10^('+(+ex)+')';};

/* ---------- 1) مدوّر الأعداد ---------- */
function rndStr(str,mode,k){
  str=String(str).trim().replace(/\s/g,'');
  const m=str.match(/^(-?)(\d*)\.?(\d*)$/);if(!m||(m[2]===''&&m[3]===''))return null;
  const neg=m[1],intp=m[2]||'0';let pp=intp.length;let d=(intp+m[3]).split('').map(Number);
  let keep;
  if(mode==='dp')keep=pp+k;else{const f1=d.findIndex(x=>x>0);if(f1<0)return neg+'0';keep=f1+k;}
  let carry=false;
  if(keep<0)return '0';
  if(keep>=d.length){while(d.length<keep)d.push(0);}
  else{const up=d[keep]>=5;d=d.slice(0,keep);
    if(up){let i=keep-1;while(i>=0){if(d[i]===9){d[i]=0;i--;}else{d[i]++;break;}}if(i<0){d.unshift(1);pp++;carry=true;}}
    while(d.length<pp)d.push(0);}
  if(carry&&mode==='sf'&&d.length>pp+0&&d.length>keep)d.pop();
  const ip=d.slice(0,pp).join('')||'0',fp=d.slice(pp).join('');
  return neg+ip+(fp?'.'+fp:'');
}
function sigCount(str){
  str=String(str).trim().replace(/\s/g,'').replace('-','');
  if(!/^\d*\.?\d*$/.test(str)||!str)return null;
  const hasDot=str.includes('.');let digs=str.replace('.','');
  const f1=digs.search(/[1-9]/);if(f1<0)return 1;
  digs=digs.slice(f1);if(!hasDot)digs=digs.replace(/0+$/,'');
  return digs.length;
}
TOOLS.round=c=>{
  el(c,`<div><label>العدد:</label><input data-k="n" value="525.7910" size="12" dir="ltr"> <label>التدوير إلى:</label><input data-k="k" type="number" min="0" max="9" value="3" style="width:60px"> <select data-k="m"><option value="sf">أرقام معنوية</option><option value="dp">منازل عشرية</option></select></div><div class="out" data-k="o"></div>`);
  wire(c,()=>{const n=K(c,'n').value,k=Math.max(0,Math.floor(+K(c,'k').value)),mode=K(c,'m').value;const r=rndStr(n,mode,k),sc=sigCount(n);
    if(r===null){K(c,'o').innerHTML='اكتب عددًا صحيحًا أو عشريًا (مثل 525.7910).';return;}
    const dp=(n.split('.')[1]||'').length;
    K(c,'o').innerHTML=`<div>عدد الأرقام المعنوية في العدد المدخل: ${M(sc)} — عدد المنازل العشرية: ${M(dp)}</div><div style="font-size:1.25em;font-weight:800;margin-top:4px">الناتج بعد التدوير إلى ${k} ${mode==='sf'?'أرقام معنوية':'منازل عشرية'}: ${M(r)}</div><div style="color:var(--muted)">القاعدة: إذا كان أول رقم محذوف ≥ 5 زدنا الرقم السابق 1، وإلا تركناه.</div>`;});
};

TOOLS.eq=c=>{
  el(c,`<h4>أ) محوّل الحرارة {{F = 1.8C + 32}}</h4>
  <div><label>°C:</label><input data-k="c" value="25" size="7" dir="ltr"> ⇄ <label>°F:</label><input data-k="fh" value="77" size="7" dir="ltr"></div><div class="out" data-k="o1"></div>
  <h4>ب) حلّال المعادلة الخطية {{a·x + b = c}}</h4>
  <div dir="ltr" style="text-align:right"><input data-k="a" value="2" size="4"> x + <input data-k="b" value="3" size="4"> = <input data-k="r" value="11" size="4"></div><div class="out" data-k="o2"></div>`.replace(/\{\{(.*?)\}\}/g,(_,x)=>M(x)));
  const upd=e=>{
    const C=K(c,'c'),F=K(c,'fh');
    if(e&&e.target===F){const v=nv(F.value);if(Number.isFinite(v))C.value=+((v-32)/1.8).toFixed(3);}
    else{const v=nv(C.value);if(Number.isFinite(v))F.value=+(1.8*v+32).toFixed(3);}
    const cc=nv(C.value),ff=nv(F.value);
    K(c,'o1').innerHTML=Number.isFinite(cc)?`${M(cc+' °C = 1.8 × '+cc+' + 32 = '+f(1.8*cc+32,2).replace(/\.?0+$/,'')+' °F')}`:'';
    const a=nv(K(c,'a').value),b=nv(K(c,'b').value),r=nv(K(c,'r').value);
    K(c,'o2').innerHTML=(a===0||!Number.isFinite(a+b+r))?'اكتب أعدادًا صحيحة (و a ≠ 0).':`<ol><li>نطرح ${M(b)} من الطرفين: ${M(a+'x = '+r+' − ('+b+') = '+(r-b))}</li><li>نقسم على ${M(a)}: ${M('x = '+(r-b)+' / '+a+' = '+(+((r-b)/a).toFixed(6)))}</li><li>تحقّق: ${M(a+' × '+(+((r-b)/a).toFixed(6))+' + ('+b+') = '+(+(a*(r-b)/a+b).toFixed(6)))}</li></ol>`;
  };
  wire(c,upd);
};

  el(c,`<div><label>الأساس b:</label><input data-k="b" value="2" size="5" dir="ltr"> <label>m:</label><input data-k="m" value="5" size="5" dir="ltr"> <label>n:</label><input data-k="n" value="2" size="5" dir="ltr"></div><div class="out" data-k="o"></div>`);
  wire(c,()=>{const b=nv(K(c,'b').value),m=nv(K(c,'m').value),n=nv(K(c,'n').value);
    if(!Number.isFinite(b+m+n)||b<=0){K(c,'o').innerHTML='اكتب b موجبًا وأسّين m و n (يمكن أن يكونا كسريين أو سالبين).';return;}
    const p=Math.pow,r=(x)=>g(x,6);
    K(c,'o').innerHTML=`<div class="row"><span class="kv">${M(P(b+'^('+m+') = ')+r(p(b,m)))}</span><span class="kv">${M(P(b+'^('+n+') = ')+r(p(b,n)))}</span></div>
